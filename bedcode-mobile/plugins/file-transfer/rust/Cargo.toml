[package]
name = "bedcode_plugin_file_transfer"
version = "1.0.0-beta"
description = "File Transfer Plugin (Mobile)"
authors = ["BedCode"]
edition = "2021"

[features]
default = []
wasm = []

[lib]
crate-type = ["cdylib"]

[dependencies]
bedcode-plugin-api-mobile = { path = "../../../packages/plugin-sdk-mobile/rust", features = ["wasm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
