[package]
name = "bedcode_plugin_auto_task"
version = "1.0.0"
edition = "2021"

[dependencies]
bedcode-plugin-api-mobile = { path = "../../../packages/plugin-sdk-mobile/rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[features]
default = []
wasm = ["wasm-bindgen", "bedcode-plugin-api-mobile/wasm"]

[dependencies.wasm-bindgen]
version = "0.2"
optional = true

[lib]
crate-type = ["cdylib", "rlib"]
