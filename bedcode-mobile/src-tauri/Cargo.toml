[package]
name = "bedcode-mobile"
version = "1.1.0"
description = "BedCode Mobile - Remote terminal for Claude Code"
authors = ["binblink"]
edition = "2021"

[lib]
name = "bedcode_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-edge-to-edge = "0.3.3"
tauri-plugin-http = "2"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process"] }

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Security
rand = "0.8"
jsonwebtoken = "9"

# Encoding
encoding_rs = "0.8"
base64 = "0.22"
hex = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async trait for dyn compatibility
async-trait = "0.1"

# WebSocket
tokio-tungstenite = "0.24"

# mDNS service discovery
mdns-sd = "0.20"
flume = "0.12"

futures-util = "0.3"

# Android logging
log = "0.4"
android_logger = "0.14"

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# ==================== 开发模式优化 ====================
[profile.dev]
debug = 1
incremental = true
split-debuginfo = "packed"

[profile.dev.package."*"]
opt-level = 2
