[package]
name = "bedcode-mobile"
version = "2.0.10"
description = "BedCode Mobile - Remote terminal for Claude Code"
authors = ["binblink"]
edition = "2021"

[lib]
name = "bedcode_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "test"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-edge-to-edge = "0.3.3"
tauri-plugin-http = "2"
# 设备 ID（Android ANDROID_ID / iOS identifierForVendor）
tauri-plugin-machine-uid = "0.1.3"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process"] }
# reqwest body 流类型（与 tokio-util ReaderStream 配对；SAF 流直传的 Box<dyn Stream> 标注用）
bytes = "1"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Security
rand = "0.8"
jsonwebtoken = "9"

# Encoding
encoding_rs = "0.8"
base64 = "0.22"
hex = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async trait for dyn compatibility
async-trait = "0.1"

# WebSocket
tokio-tungstenite = "0.24"

# mDNS service discovery
mdns-sd = "0.20"
flume = "0.12"

# Network utilities
local-ip-address = "0.6"
# Hostname（非 Android 平台设备名回退）
hostname = "0.4"

futures-util = "0.3"

# WASM runtime for plugin system
# 47：Android aarch64 平台 JIT/缓存稳定性修复（46 曾现 SIGILL 崩溃）
wasmtime = "47"

# HTTP client (WASM plugin HTTP proxy + remote download + 认证端点 .json() 解析)
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "json"] }

# 传输引擎工具（CancellationToken 取消 + ReaderStream 文件流，与桌面端 transfer 同语义）
tokio-util = { version = "0.7", features = ["io"] }

# Regex for SQL table name extraction
regex = "1"

# SHA256 hash (plugin download verification)
sha2 = "0.10"

# ZIP archive (plugin package install)
zip = "4.6"

# Android logging
log = "0.4"
android_logger = "0.14"

# Plugin SDK (Mobile)
bedcode-plugin-api-mobile = { path = "../packages/plugin-sdk-mobile/rust" }
# 对等网络共享基础设施（节点身份 + 自签证书，issue peer-network/01）
bedcode-peer-net = { path = "../../packages/peer-net" }
# 链路报文加密协议核心（issue 09 共享 crate，与桌面 server 共同消费）
bedcode-link-crypto = { path = "../../packages/link-crypto" }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }

# ==================== OCR 引擎（仅 Android 平台，规格 §4.6）====================
# ort 2.x（rc.13）：load-dynamic 运行时 dlopen libonnxruntime.so（onnxruntime-android AAR 的 .so
# 经 scripts/fetch-ort-android.sh 放入 gen/android jniLibs）；download-binaries 不支持 Android 目标。
# api-20 显式锁低版本 C API：AAR 用 1.20.0，默认 api-27 会在 dlopen 时拒绝旧 .so。
[target.'cfg(target_os = "android")'.dependencies]
ort = { version = "2.0.0-rc.13", default-features = false, features = ["load-dynamic", "ndarray", "api-20"] }
# ndarray 显式声明（ort 的 ndarray feature 为其传递依赖；ppocr 张量构建直接使用）
ndarray = "0.17"

[dev-dependencies]
tempfile = "3"
# 组件测试编码（ticket 02 宿主单测：测试组件 core module → 组件；spike 实证 0.256）
wit-component = "=0.256.0"
# 仅测试用 mock server（http_auth_flow 起 mock 桌面端 HTTP 端点；生产依赖已删，
# 不进 APK——服务器归零，手机端无任何 HTTP server 依赖）
actix-web = { version = "4", default-features = false }

[profile.release]
# unwind：panic 可被 catch_unwind（错误边界/插件宿主）捕获，插件业务 panic
# 不再拖垮整个应用（abort 会让一切 panic 处理机制失效，任何 panic 直接闪退）
panic = "unwind"
# fat LTO + 单 codegen unit 会在最终链接阶段合并全部 bitcode，峰值内存 8GB+（含 wasmtime/cranelift 时更甚），
# 在 12~16GB 内存机器上触发 OOM；改用 thin LTO + 并行 codegen，性能损失 ~2-5%，峰值内存大幅下降
# （与桌面端 release profile 对齐，2026-09 整改统一两端策略）
codegen-units = 16
lto = "thin"
opt-level = "s"
strip = true

# ==================== 开发模式优化 ====================
[profile.dev]
# debug = 1 全量调试信息使 rustc 编译巨型 crate（含 wasmtime）时内存峰值过高，
# 在 collect_and_partition_mono_items 阶段 OOM（0xc0000409，页面文件被禁用的机器上必现）。
# line-tables-only 保留行号回溯（debugger 变量查看不可用），编译内存与 target 体积大幅下降
# （与桌面端 dev profile 对齐，避免 wasmtime OOM）
debug = "line-tables-only"
incremental = true
split-debuginfo = "packed"

[profile.dev.package."*"]
opt-level = 2
