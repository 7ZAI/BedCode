<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#bg)"/>
  <!-- 本地设备 -->
  <rect x="16" y="26" width="24" height="48" rx="4" fill="#FFFFFF" fill-opacity="0.95"/>
  <circle cx="28" cy="66" r="2.5" fill="#3B82F6"/>
  <!-- 远程对端设备 -->
  <rect x="60" y="26" width="24" height="48" rx="4" fill="#FFFFFF" fill-opacity="0.95"/>
  <circle cx="72" cy="66" r="2.5" fill="#3B82F6"/>
  <!-- 上传箭头（左→右） -->
  <path d="M42 38 L52 38" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M48 32 L52 38 L48 44" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- 下载箭头（右→左） -->
  <path d="M58 58 L48 58" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M52 52 L48 58 L52 64" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
