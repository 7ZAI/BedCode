<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- 移动端视口配置 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- iOS 状态栏样式 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>BedCode</title>
  </head>
  <body class="bg-dark-900 text-dark-100">
    <div id="app">
      <!-- 静态首屏:Vue 挂载前可见(挂载后由 SplashScreen 组件无缝接管)
           颜色硬编码为墨纸深色(应用默认主题):此时设计 token 尚未加载 -->
      <style>
        .splash {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          gap: 18px;
          background: linear-gradient(160deg, #191712 0%, #15130f 55%, #0f0d0a 100%);
          font-family:
            Inter,
            system-ui,
            -apple-system,
            sans-serif;
        }
        .splash svg {
          width: 76px;
          height: 76px;
          color: #ece8dc;
        }
        /* 描边绘制 + 光标 blink,与 SplashScreen 组件同款语言;
           纯 CSS 实现,JS 加载阶段即可播放(光标即加载指示) */
        .splash .logo-caret {
          stroke-dasharray: 200;
          stroke-dashoffset: 200;
          animation: splash-draw 0.6s 0.15s cubic-bezier(0.5, 0, 0.2, 1) forwards;
        }
        .splash .logo-cursor {
          opacity: 0;
          animation:
            splash-cursor-in 0.3s 0.55s both,
            splash-blink 1.1s 1.15s infinite;
        }
        .splash .word {
          font-size: 14px;
          font-weight: 600;
          letter-spacing: 0.42em;
          text-indent: 0.42em;
          color: #ece8dc;
        }
        @keyframes splash-draw {
          to {
            stroke-dashoffset: 0;
          }
        }
        @keyframes splash-cursor-in {
          from {
            opacity: 0;
          }
          to {
            opacity: 1;
          }
        }
        @keyframes splash-blink {
          0%,
          49% {
            opacity: 1;
          }
          50%,
          100% {
            opacity: 0;
          }
        }
        @media (prefers-reduced-motion: reduce) {
          .splash .logo-caret {
            animation: none;
            stroke-dashoffset: 0;
          }
          .splash .logo-cursor {
            animation: none;
            opacity: 1;
          }
        }
      </style>
      <div class="splash" role="status" aria-label="BedCode">
        <svg viewBox="0 0 96 96" aria-hidden="true">
          <polyline
            class="logo-caret"
            points="20,22 52,52 20,82"
            fill="none"
            stroke="currentColor"
            stroke-width="9"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <rect class="logo-cursor" x="62" y="68" width="22" height="10" rx="5" fill="currentColor" />
        </svg>
        <div class="word">BEDCODE</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
