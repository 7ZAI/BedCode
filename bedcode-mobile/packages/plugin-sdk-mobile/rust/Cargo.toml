[package]
name = "bedcode-plugin-api-mobile"
version = "0.1.0"
description = "BedCode Mobile Plugin API — trait definitions and shared types for BedCode plugins"
license = "MIT"
repository = "https://github.com/7ZAI/BedCode"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
inventory = "0.3"
# WIT 契约绑定（组件迁移：wasm_entry! 生成组件导出，WasmHost 经 bindgen import 调用宿主）。
# 版本锁定 0.60.0（ticket 01 spike 实证 × wasmtime 47 兼容；回退预案 0.41 已关闭）
wit-bindgen = { version = "=0.60.0", features = ["macros"], optional = true }

[features]
default = []
# WASM 插件必开：启用 WasmPlugin trait / wasm_entry! 宏 / WasmHost 绑定。
# wasm feature 同时启用 wit-bindgen：WIT 契约（wit/bedcode.wit，单一事实来源）
# 生成 guest 绑定 —— 组件形态（Component Model）的导入/导出
wasm = ["dep:wit-bindgen"]
