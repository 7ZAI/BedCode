name: Lint (Desktop + Mobile Frontend)

on:
  push:
    paths:
      - 'bedcode-desktop/**'
      - 'bedcode-mobile/**'
      - 'eslint.config.js'
      - '.prettierrc.json'
      - '.editorconfig'
      - '.github/workflows/lint.yml'
  pull_request:
    paths:
      - 'bedcode-desktop/**'
      - 'bedcode-mobile/**'
      - 'eslint.config.js'
      - '.prettierrc.json'
      - '.editorconfig'
      - '.github/workflows/lint.yml'

# 全局单根 ESLint 配置（eslint.config.js），同时校验桌面端与移动端前端。
# 当前状态：npx eslint . 0 error（warning 暂不计入，逐步收紧）。
# CI 用 `npx eslint .`（不带 --fix），纯校验；失败即阻断合并，锁住 0-error 基准。
permissions:
  contents: read

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install

      - name: ESLint (fail on errors)
        run: npx eslint .
