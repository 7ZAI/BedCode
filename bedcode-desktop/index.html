<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- 移动端视口配置：不再设 maximum-scale / user-scalable，桌面 WebKitGTK 需要允许
         CSS zoom 与 Ctrl+=；移动端若需限制缩放在组件层用 touch-action 处理 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- iOS 状态栏样式 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>BedCode</title>
  </head>
  <body class="bg-dark-900 text-dark-100">
    <div id="app">
      <!--
        静态首屏：Vue 挂载前（含 SplashLoading 之前）的过渡帧，随 #app 内容一起被替换掉。
        此刻 style.css 的 token 与应用内主题设置（SQLite AppConfig）都还没加载，
        只能跟随系统深浅色（与移动端 index.html 静态首屏同源的做法）；
        应用内手动选的主题从 SplashLoading.vue 起才生效。
        下面的浅色字面值是 style.css 浅色 token 的手工镜像（改 token 需同步这里），
        深色分支保持既有 slate 配色不动（与品牌开屏深色的差异属既有状态）。
      -->
      <style>
        .splash {
          display: flex;
          height: 100vh;
          align-items: center;
          justify-content: center;
          background: #0f172a;
        }
        .spinner {
          width: 32px;
          height: 32px;
          border-radius: 50%;
          border: 3px solid #1e293b;
          border-top-color: #6366f1;
          animation: spin 0.8s linear infinite;
        }
        /* 浅色系统：镜像 style.css 浅色 token —— 底 #f5f4f0→#efede7（--bg-page→--bg-sidebar），
           环身 #e4e1d8（--border），前进端 #26231b（--text-primary） */
        @media (prefers-color-scheme: light) {
          .splash {
            background: linear-gradient(135deg, #f5f4f0, #efede7);
          }
          .spinner {
            border-color: #e4e1d8;
            border-top-color: #26231b;
          }
        }
        @keyframes spin {
          to {
            transform: rotate(360deg);
          }
        }
      </style>
      <div class="splash"><div class="spinner"></div></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
