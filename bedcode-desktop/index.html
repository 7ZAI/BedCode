<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- 移动端视口配置 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- iOS 状态栏样式 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>BedCode</title>
  </head>
  <body class="bg-dark-900 text-dark-100">
    <div id="app">
      <style>
        .splash { display:flex; height:100vh; align-items:center; justify-content:center; background:#0f172a; }
        .spinner { width:32px; height:32px; border-radius:50%; border:3px solid #1e293b; border-top-color:#6366f1; animation:spin .8s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg) } }
      </style>
      <div class="splash"><div class="spinner"></div></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
