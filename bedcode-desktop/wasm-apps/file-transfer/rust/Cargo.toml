[package]
name = "bedcode-plugin-file-transfer"
version = "1.0.0-beta"
description = "File Transfer Plugin — 内网文件传输"
authors = ["BedCode"]
edition = "2021"

[features]
default = ["native"]
native = []
wasm = []

[lib]
crate-type = ["cdylib"]

[dependencies]
bedcode-plugin-api = { path = "../../../packages/plugin-sdk-desktop/rust", features = ["wasm"] }
# 双端共享业务核（ADR 0044）：可共享面收敛为一份，双端差异面全部经端口 trait 注入
bedcode-file-transfer-core = { path = "../../../../packages/bedcode-file-transfer-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
