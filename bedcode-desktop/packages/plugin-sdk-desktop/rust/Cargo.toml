[package]
name = "bedcode-plugin-api"
version = "0.1.0"
description = "BedCode Plugin API — trait definitions and shared types for BedCode plugins"
authors = ["binblink"]
edition = "2021"

[lib]
# rlib：宿主与插件以依赖方式链接；
# cdylib：test-plugin feature 编译到 wasm32 时生成 .wasm 产物（供宿主 ABI 测试加载）
crate-type = ["lib", "cdylib"]

[features]
default = []
# 启用 WasmPlugin trait / wasm_entry! 宏 / WasmHost 绑定（WASM 插件必开）
wasm = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
inventory = "0.3"
