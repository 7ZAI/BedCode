[package]
name = "bedcode-componentize"
version = "0.1.0"
edition = "2021"
description = "BedCode 插件组件化工具 — 将 wit-bindgen 产出的 core module 编码为 Component Model 组件（等价 wasm-tools component new）"

[[bin]]
name = "componentize"
path = "src/main.rs"

[dependencies]
# 与宿主测试（src-tauri dev-dep）同版本，保证编码行为一致
wit-component = "=0.256.0"
