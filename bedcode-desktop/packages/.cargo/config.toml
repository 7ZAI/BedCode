# ==================== 测试夹具共享 target 目录 ====================
# 本仓库无根 workspace，`packages/plugin-*-test`（9 个夹具 crate）各自独立
# workspace。cargo 默认把产物写进**各自 crate 根的 `target/`**，而这些夹具的依赖图
# 几乎完全相同（`bedcode-plugin-api` → `wit-bindgen` + `bedcode-plugin-api-macros`
# → serde/anyhow/inventory），于是同一份依赖被重复编译 9 遍（2026-09-26 实测：
# 11 个夹具 target 合计 6.0G，每 crate 429M~836M）。
#
# 本文件让「cwd 在 packages/ 之下」的一切 cargo 调用（宿主测试里的夹具构建器、
# 手工 `cd packages/plugin-*-test && cargo build`、以及 clippy / rust-analyzer
# 之类的工具链探针）都落到同一目录 `bedcode-desktop/target/fixtures`。
#
# 路径真源 = `src-tauri/src/wasm_core/manager/runtime/fixture_target.rs`
# （`dir()` / `artifact()`，由宿主测试的 12 处夹具构建器经 `CARGO_TARGET_DIR`
# 显式注入；env 优先级高于本文件，两处指向同一目录，注释互相指认）。
#
# 不影响宿主构建：宿主 cargo 以 `bedcode-desktop/src-tauri` 为 cwd 启动，
# `packages/` 不是它的祖先目录，cargo 配置按 cwd 祖先链发现（故本文件对宿主无效）。
#
# 与 wasm 应用共享目录（`bedcode-desktop/target/wasm-apps`）**刻意分开**：夹具
# crate 定义了 `[profile.release] opt-level="s" / lto=true`，而 wasm 应用无
# `[profile.*]`；profile 参与产物指纹，同一目录会产出两份依赖产物。
#
# 决策记录：.scratch/2026-09-26-cargo-target-space/spec.md
[build]
target-dir = "../../target/fixtures"
