[package]
name = "bedcode-plugin-sdk-test"
version = "0.1.0"
description = "BedCode SDK 组件形态测试插件 — wasm_entry! 宏 + WasmHost 组件绑定的真实链路验证（仅供宿主测试套件使用）"
authors = ["binblink"]
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
bedcode-plugin-api = { path = "../plugin-sdk-desktop/rust", features = ["wasm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
# 与 plugin-test 对齐：wasm 产物尺寸优先（宿主测试加载）
opt-level = "s"
lto = true
