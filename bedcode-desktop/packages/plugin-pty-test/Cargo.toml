[package]
name = "bedcode-plugin-pty-test"
version = "0.1.0"
description = "BedCode host-pty（ABI v16）fixture 插件 —— 插件私有裸 PTY 创建 / 游标拉取输出 / owner 作用域退出事件订阅（仅供宿主测试套件使用）"
authors = ["binblink"]
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
bedcode-plugin-api = { path = "../plugin-sdk-desktop/rust", features = ["wasm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
# 与其它 fixture 对齐：wasm 产物尺寸优先（宿主测试加载）
opt-level = "s"
lto = true
