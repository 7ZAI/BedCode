[package]
name = "bedcode-plugin-bench-test"
version = "0.1.0"
description = "BedCode 桥接基准夹具插件 —— wasm↔宿主↔前端 全链路性能探针的被测端（仅供 bench 工程使用，不随产品分发）"
authors = ["binblink"]
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
bedcode-plugin-api = { path = "../plugin-sdk-desktop/rust", features = ["wasm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
# 与其它 fixture 对齐：wasm 产物尺寸优先（宿主测试加载）
opt-level = "s"
lto = true
