[package]
name = "bedcode-plugin-wasi-test"
version = "0.1.0"
description = "WASI preopen 测试插件 — 经 wasm32-wasip2 + std::fs 直写预打开目录（仅供宿主测试套件使用）"
authors = ["binblink"]
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
bedcode-plugin-api = { path = "../plugin-sdk-desktop/rust", features = ["wasm"] }
serde_json = "1"
anyhow = "1"

[profile.release]
# 与 plugin-component-test 对齐：wasm 产物尺寸优先（宿主测试加载）
opt-level = "s"
lto = true