[package]
name = "bedcode-server-http"
version = "0.1.0"
description = "BedCode 桌面 HTTP 传输面：动态端点注册表/协议网关/插件代理控制器/认证与流量过滤中间件/DTO 形状锚点 + host-http 能力域的插件绑定层（入站 2 + 出站 1 原语，wasm-core-lib-split 票 06）"
authors = ["binblink"]
edition = "2021"

[dependencies]
# Actix Web（HTTP 路由 + 中间件 + 测试 harness）
actix-web = "4"
# TransportFace::wrap 的 BoxService 装箱契约（类型与 bedcode-server-core 同源）
actix-service = "2"
# 异步（背景图端点 tokio::fs；测试 harness）
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "time"] }
# 端点句柄 uuid
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = { version = "0.1", features = ["attributes"] }
# http_filter 的 LocalBoxFuture
futures-util = "0.3"
# 认证档位词汇 EndpointAuth（宿主/插件契约真源）
bedcode-plugin-api = { path = "../plugin-sdk-desktop/rust" }
# 基础层（AppError/Result、常量、NetworkConfig、端口 traits 与全局注册表）
bedcode-server-base = { path = "../bedcode-server-base" }
# 内核层（流量过滤链 TrafficFilterChain/Direction/FilterContext/TrafficChannel、
# 链路加密 NEGOTIATION_HEADER、supervisor 状态）
bedcode-server-core = { path = "../bedcode-server-core" }
# ==================== 插件绑定层（host-http 能力域，wasm-core-lib-split 票 06） ====================
# 机制内核：插件实例状态（`add_to_linker::<S,D>` 的单态 S 必须在本 crate 可命名）
bedcode-host-kit = { path = "../../../packages/bedcode-host-kit" }
# WIT 契约绑定（`bindgen!` 在 src/plugin_binding.rs，本 crate 自带 provider 侧生成）
# —— spec D8「能力 crate 不自带 generate!」的前提在本 crate 不成立：宿主侧 `bedcode`
# 模块是 **guest 视角**（import 是调用函数，不是 `Host` trait + `add_to_linker`），
# 能力 crate 要自己装配就必须跑 provider 侧 `bindgen!`。两侧生成的 `Host` trait
# **同名但不同类型**，故宿主必须同时删掉自己的 http `Host` impl（否则重复注册）。
wit-bindgen = { version = "=0.60.0", features = ["macros"] }
# `Linker` / `HasSelf` / `add_to_linker::<S,D>` 的宿主侧类型与函数；
# 版本随两端宿主锁版（ADR 0019）
wasmtime = { version = "48", features = ["component-model"] }
# 能力模块自报（`submit_module!` 展开为 inventory 静态提交）
inventory = "0.3"
# 出站 HTTP 客户端（版本与宿主 `src-tauri/Cargo.toml` 同锁 0.12；随出站域一并搬入
# 本 crate，编译成本不变——见 spec §7 D10）
reqwest = { version = "0.12", features = ["stream"] }
# 出站执行层的错误类型（`anyhow::anyhow!` 错误串逐字保留）
anyhow = "1"

[dev-dependencies]
tempfile = "3"
# 出站域的本地 TCP 夹具（mock / 计数 / 302 / 分块流）需要 `tokio::net::TcpListener`
# 与 `AsyncRead/WriteExt`；生产出站路径走 reqwest 自带栈，这两个 feature 只进测试
tokio = { version = "1", features = ["net", "io-util"] }
# http_filter 的 01 完成事件日志用例需要捕获式 subscriber（fmt layer + MakeWriter）
tracing-subscriber = { version = "0.3", features = ["fmt", "registry"] }
# 票 08：链路加密 HTTP 集成用例（从宿主 `src-tauri/tests/link_crypto_http.rs` 迁入，
# 见该文件头「为什么住在 http 面」）。该用例扮演**客户端**，需要 x25519 密钥对原语
# ——生产代码一律经 core 的 link_crypto 取能力，不直接依赖算法引擎；只有测试侧要
# 自建对端密钥才需要直取。`base64` 随 x25519 一起来。
bedcode-crypto-engine = { path = "../bedcode-crypto-engine" }
base64 = "0.21"
# 本 crate 无 `[[test]]` 段：cargo 按 `tests/*.rs` 自动发现，新增即生效（与 `src-tauri`
# 的 `[[test]]` 手写登记不同）。
