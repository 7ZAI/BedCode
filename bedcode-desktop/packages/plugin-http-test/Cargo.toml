[package]
name = "bedcode-plugin-http-test"
version = "0.1.0"
description = "BedCode host-http 服务端域（ABI v29）fixture 插件 —— 动态路由注册 / 模板捕获 / _http_endpoint 回显（仅供宿主测试套件使用）"
authors = ["binblink"]
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
bedcode-plugin-api = { path = "../plugin-sdk-desktop/rust", features = ["wasm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
# 与其它 fixture 对齐：wasm 产物尺寸优先（宿主测试加载）
opt-level = "s"
lto = true
