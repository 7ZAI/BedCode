[package]
name = "bedcode-plugin-test"
version = "0.1.0"
description = "BedCode 测试插件 — ABI 胶水层签名验证与连通性测试（仅供宿主测试套件使用）"
authors = ["binblink"]
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# 迁移阶段 B：本插件为 core 形态测试载体，自包含旧 ABI 胶水（不启用 wasm feature）
bedcode-plugin-api = { path = "../plugin-sdk-desktop/rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
