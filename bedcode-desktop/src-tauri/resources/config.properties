# ==================== 网络配置 ====================

# WebSocket 服务器端口
network.port=8765

# 应用启动时是否自动开启服务器
network.auto_start=true

# 服务器运行时阻止系统休眠
network.prevent_sleep=true

# ==================== 会话默认配置 ====================

# 默认执行环境（windows / wsl2）
session.default_environment=windows

# 默认 WSL 发行版（仅 wsl2 环境有效，留空则使用默认发行版）
session.default_wsl_distro=

# 默认工作目录（留空则使用用户主目录）
session.default_working_dir=

# 默认启动命令
session.default_command=claude

# 会话超时时间（秒）- 无活动自动关闭
session.session_timeout=3600

# ==================== UI 界面配置 ====================

# 主题（light / dark / system）
ui.theme=system

# 终端字体大小
ui.terminal_font_size=12

# 终端字体名称
ui.terminal_font_family=Consolas

# 终端配色主题名
ui.terminal_theme=dracula

# 是否显示终端预览
ui.show_preview=true

# 语言偏好（zh-CN / en）
ui.language=zh-CN

# ==================== Channel 容量配置 ====================
# 控制 Tokio broadcast/mpsc channel 的缓冲区大小
# 影响高负载场景下的消息处理能力和内存占用

# PTY 输出事件广播容量 - 用于转发终端输出到前端
channels.output_broadcast_capacity=2048

# 会话状态变更广播容量 - 用于通知状态更新
channels.status_broadcast_capacity=64

# 会话重启事件广播容量 - 用于通知会话重启
channels.restart_broadcast_capacity=64

# 统一事件广播容量 - 整合所有事件类型
channels.event_broadcast_capacity=256

# PTY 订阅广播容量 - 用于移动端订阅输出
channels.pty_subscription_capacity=1024

# 全局输出队列容量 - 存储历史输出供移动端回放
channels.global_queue_capacity=50000

# WebSocket 事件广播容量 - 业务层事件分发
channels.ws_event_capacity=1024

# 生命周期事件广播容量 - PTY 进程状态变更
channels.lifecycle_capacity=16

# ==================== 终端配置 ====================
# 控制 PTY 终端的默认参数和输出处理行为

# 默认终端列数
terminal.default_cols=120

# 默认终端行数
terminal.default_rows=40

# 服务端输出合并开关（true/false）- 开启后远程通道（移动端）按 flush_interval_ms 合并输出
# 减少 WS 消息数；桌面本地通道恒为零缓冲直通。弱网/高频输出场景建议开启
terminal.merge_output=true

# 远程通道输出缓冲刷新间隔（毫秒）- 合并开关开启时生效；桌面本地通道零缓冲直通
terminal.flush_interval_ms=30

# 最大输出缓冲大小（字节）- 达到此大小立即刷新
terminal.max_buffer_size=65536

# PTY 读取缓冲区大小（字节）- 单次读取的最大字节数
terminal.read_buffer_size=4096

# ==================== 日志配置 ====================

# 运行时日志文件级别（trace / debug / info / warn / error）
log.file_level=info

# 控制台日志过滤器（支持 EnvFilter 语法，如 bedcode_lib=debug,actix_web=info）
log.console_filter=bedcode_lib=debug,actix_web=info,actix_http=info

# 日志文件轮转策略（daily / hourly / never）
log.rotation=daily

# 日志文件最大保留数量（0 = 不限制）
log.max_files=7

# Release 模式是否启用控制台输出（调试用，默认关闭）
log.console_in_release=false

# ==================== 插件配置 ====================

# HTTP API 认证 token - 插件推送任务状态时需携带此 token
# 为空时跳过验证（开发模式），运行时自动生成合法 token
plugin.token=
