[package]
name = "bedcode-plugin-api"
version = "0.1.0"
description = "BedCode Plugin API — trait definitions and shared types for BedCode plugins"
authors = ["binblink"]
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
async-trait = "0.1"
inventory = "0.3"
tokio = { version = "1", features = ["sync"] }
