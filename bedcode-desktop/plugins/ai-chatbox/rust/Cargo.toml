[package]
name = "bedcode-plugin-ai-chatbox"
version = "1.0.0"
description = "AI Chatbox Plugin — AI chat and terminal prompt optimization"
authors = ["BedCode"]
edition = "2021"

[features]
default = ["native"]
native = ["reqwest", "tokio", "futures-util"]
wasm = []

[lib]
crate-type = ["cdylib"]

[dependencies]
bedcode-plugin-api = { path = "../../../packages/plugin-sdk-desktop/rust", features = ["wasm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"

# native-only: 直接 HTTP 请求，WASM 模式通过 WasmHost::http_fetch 代理
reqwest = { version = "0.12", features = ["stream", "json"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"], optional = true }
futures-util = { version = "0.3", optional = true }
