[package]
name = "bedcode-plugin-ai-chatbox"
version = "1.0.0-beta"
description = "AI Chatbox Plugin — AI chat with JSONL conversation logs"
authors = ["BedCode"]
edition = "2021"

[features]
default = ["wasm"]
wasm = []

[lib]
crate-type = ["cdylib"]

[dependencies]
bedcode-plugin-api = { path = "../../../packages/plugin-sdk-desktop/rust", features = ["wasm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
