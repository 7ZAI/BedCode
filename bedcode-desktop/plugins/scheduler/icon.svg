<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#bg)"/>
  <!-- 时钟外圈 -->
  <circle cx="50" cy="50" r="28" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  <!-- 四点刻度 -->
  <line x1="50" y1="26" x2="50" y2="30" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="70" x2="50" y2="74" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="26" y1="50" x2="30" y2="50" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="70" y1="50" x2="74" y2="50" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 时针（指向 10） -->
  <line x1="50" y1="50" x2="50" y2="34" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <!-- 分针（指向 10:10 位置） -->
  <line x1="50" y1="50" x2="62" y2="42" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <circle cx="50" cy="50" r="3" fill="#FFFFFF"/>
</svg>
