[package]
name = "bedcode-plugin-auto-task"
version = "1.0.0-beta"
description = "Auto Task Plugin — agent task status sync and auto-approve (Claude Code / pi / opencode / Codex)"
authors = ["BedCode"]
edition = "2021"

[features]
default = ["native"]
native = []
wasm = []

[lib]
crate-type = ["cdylib"]

[dependencies]
bedcode-plugin-api = { path = "../../../packages/plugin-sdk-desktop/rust", features = ["wasm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
