[package]
name = "bedcode"
version = "0.1.0"
description = "Remote control for Claude Code via mobile devices"
authors = ["binblink"]
edition = "2021"

[lib]
name = "bedcode_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process"] }

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Security
rand = "0.8"
jsonwebtoken = "9"

# Encoding
encoding_rs = "0.8"
base64 = "0.22"
hex = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# File watching
notify = "6"

# Regex for parsing
regex = "1"

# Network utilities
local-ip-address = "0.6"

# Async trait for dyn compatibility
async-trait = "0.1"

# WebSocket (shared between desktop and mobile)
tokio-tungstenite = "0.24"
futures-util = "0.3"
tauri-plugin-edge-to-edge = "0.3.3"
tauri-plugin-http = "2"
dirs = "6.0.0"

# Android-only dependencies
[target.'cfg(target_os = "android")'.dependencies]
log = "0.4"
android_logger = "0.14"

# Desktop-only dependencies
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Actix Web (desktop HTTP + WS server)
actix-web = "4"
actix = "0.13"
actix-web-actors = "4"
actix-rt = "2"
actix-cors = "0.7"
# PTY management
portable-pty = "0.8"

[dev-dependencies]
# Testing
criterion = { version = "0.5", features = ["async_tokio"] }
tempfile = "3"

# Benchmark targets
[[bench]]
name = "parser_bench"
harness = false

[profile.bench]
panic = "unwind"
inherits = "release"
opt-level = 3
lto = false
strip = false

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# ==================== 开发模式优化 ====================
# 减少调试信息大小，加速开发编译
[profile.dev]
debug = 1              # 仅保留行号信息，减少编译时间和磁盘占用
incremental = true     # 启用增量编译
split-debuginfo = "packed"  # 分离调试信息，减少主文件大小

# 开发模式不优化依赖项，加速编译

# 依赖项在 dev 模式下启用优化（依赖项不常变，优化后加速链接和运行）
[profile.dev.package."*"]
opt-level = 2
