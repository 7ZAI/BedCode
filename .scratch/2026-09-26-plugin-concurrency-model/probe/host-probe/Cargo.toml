[package]
name = "concurrency-owner-probe"
version = "0.1.0"
description = "Ticket 04 probe host: async-lifted export + async import (suspend/resume)"
authors = ["binblink"]
edition = "2021"

[dependencies]
# 与生产宿主同版本（bedcode-desktop/src-tauri/Cargo.toml）
wasmtime = "=48.0.3"
wasmtime-wasi = { version = "=48.0.3", features = ["p3"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
anyhow = "1"
# 取证小工具（bin/wat.rs）：打印组件 WAT
wasmprinter = "0.254"
