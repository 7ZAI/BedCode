[package]
name = "bedcode-async-export-probe"
version = "0.1.0"
description = "Ticket 04 probe fixture: async-lifted export + async import (wasip3)"
authors = ["binblink"]
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# 与生产 SDK 完全同一版本（packages/plugin-sdk-desktop/rust/Cargo.toml: wit-bindgen = "=0.60.0"）；
# 特征集对齐上游官方 test-programs（`crates/test-programs/Cargo.toml`:
#   wit-bindgen = { features = ['default', 'async-spawn', 'inter-task-wakeup'] }）——
# 官方 async_round_trip_* 用例正是在该特征集下构建的
wit-bindgen = { version = "=0.60.0", features = ["macros", "async-spawn", "inter-task-wakeup"] }

[profile.release]
opt-level = "s"
lto = true
