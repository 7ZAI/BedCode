<!doctype html>
<html lang="zh-CN" data-palette="warm" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BedCode — 方案 C：设备壳 v0.2（主屏 + 卡片切换）</title>
<style>
/* ============================================================================
   设计 token：全部取自 bedcode-desktop/src/style.css（:root warm 色板 + :root.dark）
   零新增 hex / 零新字体族 / 零 Google Fonts（frontend-styles token-bound 铁律）
   暗色选择器 :root.dark（类挂 <html>，与 style.css 一致——挂 body 上不生效）。
   ============================================================================ */
:root {
  color-scheme: light;

  --font: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, system-ui, sans-serif;
  --mono: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace;

  /* 与 style.css 同源的字号档（基准 12px），预览不叠加 --ui-scale 保证可读 */
  --font-size-xs: 9px;
  --font-size-sm: 10px;
  --font-size-base: 12px;
  --font-size-lg: 14px;
  --font-size-xl: 16px;

  --bg-page: #f5f4f0;
  --bg-sidebar: #efede7;
  --bg-card: #fdfcfa;
  --bg-hover: #e7e4dc;
  --bg-input: #fdfcfa;

  --text-primary: #26231b;
  --text-secondary: #7c7565;
  --text-tertiary: #aba492;

  --border: #e4e1d8;
  --border-strong: #d6d2c4;
  --border-input: #d6d2c4;

  --color-primary: #1d1a14;
  --color-primary-hover: #0f0d09;
  --color-primary-light: #efede5;
  --color-primary-contrast: #fdfcfa;

  --color-success: #22c55e;
  --color-success-light: rgba(34, 197, 94, 0.14);
  --color-warning: #f59e0b;
  --color-warning-light: rgba(245, 158, 11, 0.16);
  --color-danger: #ef4444;
  --color-danger-light: rgba(239, 68, 68, 0.12);
  --color-info: #2563eb;
  --color-info-light: rgba(37, 99, 235, 0.12);

  --radius-card: 10px;
  --radius-button: 8px;
  --radius-input: 8px;
  --radius-tag: 6px;

  --shadow-card: 0 1px 2px rgba(38, 35, 27, 0.04);
  --shadow-card-hover: 0 4px 16px rgba(38, 35, 27, 0.08);
  --shadow-input-focus: 0 0 0 3px rgba(29, 26, 20, 0.08);

  /* ---- 本方案新增 token（落地时按「3+ 组件复用」路径迁 style.css） ---- */
  --radius-app-icon: 28%;   /* 应用图标圆角（squircle 近似）：图标网格的视觉核心 */
  --radius-sheet: 16px;     /* 大圆角：卡片 / 弹窗 / 通知面板 */
  --toolbar-h: 44px;        /* 顶部工具栏（含导航与窗口控制） */

  /* 主屏壁纸：token 派生渐变（零新 hex）。遮罩层单独一层背景，强度由 --wall-dim 控制 */
  --wall-aurora: linear-gradient(158deg, color-mix(in srgb, var(--color-info) 24%, var(--bg-page)) 0%, color-mix(in srgb, var(--color-success) 18%, var(--bg-page)) 52%, var(--bg-page) 100%);
  --wall-dune: linear-gradient(158deg, color-mix(in srgb, var(--color-warning) 20%, var(--bg-page)) 0%, color-mix(in srgb, var(--color-primary) 10%, var(--bg-page)) 55%, var(--bg-page) 100%);
  --wall-reef: linear-gradient(158deg, color-mix(in srgb, var(--color-info) 18%, var(--bg-page)) 0%, color-mix(in srgb, var(--color-primary) 14%, var(--bg-page)) 60%, var(--bg-page) 100%);
}
:root.dark {
  color-scheme: dark;
  --bg-page: #15130f;
  --bg-sidebar: #191712;
  --bg-card: #1d1a15;
  --bg-hover: #2a261e;
  --bg-input: #1d1a15;
  --text-primary: #ece8dc;
  --text-secondary: #9c9482;
  --text-tertiary: #6b6455;
  --border: #2e2a22;
  --border-strong: #3c372b;
  --border-input: #3c372b;
  --color-primary: #ece8dc;
  --color-primary-hover: #f5f2ea;
  --color-primary-light: rgba(236, 232, 220, 0.12);
  --color-primary-contrast: #15130f;
  --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.2);
  --shadow-card-hover: 0 4px 16px rgba(0, 0, 0, 0.35);
  --shadow-input-focus: 0 0 0 3px rgba(236, 232, 220, 0.1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font);
  font-size: var(--font-size-base);
  background: var(--bg-page);
  color: var(--text-primary);
  height: 100vh;
  overflow: hidden;
  line-height: 1.5;
  transition: background-color 0.2s, color 0.2s, border-color 0.2s;
}

button { font-family: inherit; font-size: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, select { font-family: inherit; font-size: inherit; }
/* 不要给 svg 强制 display:block —— 行内按钮里的图标会被顶到独立一行导致文字裁切 */
svg { flex-shrink: 0; vertical-align: middle; }

/* 焦点可见：键盘导航必须看得见落点（WCAG 2.2 焦点外观） */
:focus-visible { outline: 2px solid var(--color-info); outline-offset: 1px; border-radius: 4px; }
:focus:not(:focus-visible) { outline: none; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; animation-delay: 0ms !important; }
}

/* ==================== 外框（窗口 = 设备） ==================== */
.device { display: flex; flex-direction: column; height: 100vh; background: var(--bg-page); }

/* ==================== 顶部工具栏（品牌 · 导航 · 全局入口 · 窗口控制） ==================== */
.toolbar {
  height: var(--toolbar-h); flex-shrink: 0; display: flex; align-items: center; gap: 8px;
  padding: 0 8px 0 12px; background: var(--bg-card); border-bottom: 1px solid var(--border);
  user-select: none; position: relative; z-index: 30;
}
.tb-brand { display: flex; align-items: center; gap: 8px; min-width: 0; flex-shrink: 0; }
.tb-brand b { font-size: var(--font-size-lg); font-weight: 600; letter-spacing: -0.01em; }
.tb-where { font-size: var(--font-size-sm); color: var(--text-tertiary); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tb-nav { display: flex; align-items: center; gap: 2px; margin-left: 10px; flex-shrink: 0; }
.tb-btn { min-width: 32px; height: 28px; padding: 0 7px; border-radius: var(--radius-button);
  color: var(--text-secondary); display: inline-flex; align-items: center; justify-content: center;
  gap: 6px; font-size: var(--font-size-base); position: relative;
  transition: background-color 0.15s, color 0.15s; }
.tb-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
.tb-btn:disabled { opacity: 0.35; cursor: default; }
.tb-btn:disabled:hover { background: none; color: var(--text-secondary); }
.tb-btn.on { background: var(--color-primary-light); color: var(--text-primary); }
.tb-btn .bdg { position: absolute; top: 0; right: 0; min-width: 13px; height: 13px; padding: 0 3px;
  border-radius: 7px; background: var(--color-danger); color: var(--color-primary-contrast);
  font-size: var(--font-size-xs); font-weight: 600; display: flex; align-items: center; justify-content: center; }
.tb-right { display: flex; align-items: center; gap: 2px; margin-left: auto; flex-shrink: 0; }
.tb-sep { width: 1px; height: 16px; background: var(--border-strong); margin: 0 5px; flex-shrink: 0; }
.tb-win { width: 34px; height: 28px; border-radius: var(--radius-button); color: var(--text-secondary);
  display: inline-flex; align-items: center; justify-content: center; transition: background-color 0.15s, color 0.15s; }
.tb-win:hover { background: var(--bg-hover); color: var(--text-primary); }
.tb-win.close:hover { background: var(--color-danger); color: var(--color-primary-contrast); }

/* ==================== 舞台（home / card 两屏 + 覆层） ==================== */
.stage { flex: 1; min-height: 0; position: relative; overflow: hidden; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden; }
.screen[hidden] { display: none; }
/* 屏幕进入动效：减速到达（ease-out），只动 transform/opacity，不碰布局属性 */
.screen.entering { animation: scr-in 0.22s cubic-bezier(0.2, 0.8, 0.3, 1); }
@keyframes scr-in { from { opacity: 0; transform: scale(0.97) translateY(6px); } to { opacity: 1; transform: none; } }

/* ==================== 主屏（Home：运行卡片带 + 应用网格 + 系统网格） ==================== */
.home { overflow-y: auto; padding: 18px 20px 20px; gap: 22px; }
/* 壁纸只落主屏（卡片全屏保持纯色保证业务内容可读）。两层背景：上层可调强度遮罩
  （护文字对比度）、下层渐变；背景随元素自身不随内容滚动，滚动时壁纸不动。 */
.home.wall-aurora, .home.wall-dune, .home.wall-reef {
  background-image: linear-gradient(color-mix(in srgb, var(--bg-page) calc(var(--wall-dim, 0.3) * 100%), transparent) 0%, color-mix(in srgb, var(--bg-page) calc(var(--wall-dim, 0.3) * 100%), transparent) 100%), var(--wall-active);
}
.home.wall-aurora { --wall-active: var(--wall-aurora); }
.home.wall-dune { --wall-active: var(--wall-dune); }
.home.wall-reef { --wall-active: var(--wall-reef); }
/* 设置页壁纸预览色块（无遮罩层，直出渐变） */
.pal-sw.wsw-aurora { background-image: var(--wall-aurora); }
.pal-sw.wsw-dune { background-image: var(--wall-dune); }
.pal-sw.wsw-reef { background-image: var(--wall-reef); }
.home-sec { width: min(920px, 100%); margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.sec-h { display: flex; align-items: center; gap: 8px; padding: 0 2px; }
.sec-h .t { font-size: var(--font-size-lg); font-weight: 600; }
.sec-h .n { font-size: var(--font-size-sm); color: var(--text-tertiary); }
.sec-h .grow { flex: 1; }

/* 运行卡片带：横滑，每张卡 = 一个打开中的应用或系统页 */
.hstrip { display: flex; gap: 12px; overflow-x: auto; padding: 2px 2px 8px;
  scroll-snap-type: x proximity; scrollbar-width: thin; }
.hcard { flex: 0 0 auto; width: 250px; scroll-snap-align: start; display: flex; flex-direction: column;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sheet);
  overflow: hidden; box-shadow: var(--shadow-card); cursor: pointer; position: relative;
  animation: rc-up 0.24s cubic-bezier(0.2, 0.8, 0.3, 1) backwards; animation-delay: calc(var(--i) * 40ms);
  transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s; }
.hcard:hover { border-color: var(--border-strong); transform: translateY(-2px); box-shadow: var(--shadow-card-hover); }
.hcard.active { border-color: var(--color-primary); box-shadow: var(--shadow-input-focus); }
@keyframes rc-up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.hcard-head { display: flex; align-items: center; gap: 7px; padding: 7px 7px 7px 10px;
  border-bottom: 1px solid var(--border); }
.hcard-head .glyph-box { width: 20px; height: 20px; border-radius: 30%; display: flex;
  align-items: center; justify-content: center; flex-shrink: 0; }
.hcard-head .nm { flex: 1; min-width: 0; font-size: var(--font-size-base); font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hcard-x { width: 24px; height: 24px; border-radius: 50%; color: var(--text-tertiary); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; transition: background-color 0.15s, color 0.15s; }
.hcard-x:hover { background: var(--color-danger-light); color: var(--color-danger); }
/* 卡片正文 = 内容的静态缩略：inert + pointer-events:none，交互只走卡片本身 */
.hcard-view { height: 190px; overflow: hidden; background: var(--bg-page); pointer-events: none; }
.hcard-view * { pointer-events: none; }
.hcard-view .appbar { height: 30px; padding: 0 10px; }
.hcard-view .appbar .nm { font-size: var(--font-size-base); }
.hcard-view .appbar .sub { display: none; }
.hcard-view .term { font-size: 8px; line-height: 1.6; padding: 8px 9px; }
.hcard-view .msg { font-size: var(--font-size-sm); padding: 5px 7px; }
.hcard-view .frow { padding: 5px 6px; }
.hcard-view .frow .nm { font-size: var(--font-size-sm); }
/* 系统页卡片缩略：骨架条 */
.skel { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.skel i { display: block; height: 10px; border-radius: 5px; background: var(--bg-hover); }
.skel i.w40 { width: 40%; } .skel i.w70 { width: 70%; } .skel i.w55 { width: 55%; } .skel i.w85 { width: 85%; }

/* 图标网格 */
.appgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
  gap: 8px 4px; align-content: start; }
.appicon { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 10px 4px 8px;
  border-radius: var(--radius-card); cursor: pointer; position: relative; background: none;
  transition: background-color 0.15s; }
.appicon:hover { background: var(--bg-hover); }
.appicon:active { transform: scale(0.96); }
.appicon .glyph-wrap { position: relative; }
.appicon .glyph-box { width: 52px; height: 52px; border-radius: var(--radius-app-icon);
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.18s, box-shadow 0.18s; }
.appicon:hover .glyph-box { transform: translateY(-2px); box-shadow: var(--shadow-card-hover); }
.appicon .nm { font-size: var(--font-size-base); color: var(--text-primary); max-width: 100%;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.appicon .sdot { position: absolute; top: -1px; right: -1px; width: 9px; height: 9px; border-radius: 50%;
  box-shadow: 0 0 0 2px var(--bg-page); }
.appicon .bdg-approval { position: absolute; top: -3px; right: -3px; min-width: 15px; height: 15px;
  border-radius: 8px; background: var(--color-danger); color: var(--color-primary-contrast);
  font-size: var(--font-size-xs); font-weight: 700; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 0 2px var(--bg-page); }
.appicon.hit .glyph-box { outline: 2px solid var(--color-info); outline-offset: 2px; }
/* 图标底色：color-mix 从既有语义 token 派生，双主题自动适配，零新 hex */
.tone-primary { background: color-mix(in srgb, var(--color-primary) 14%, var(--bg-card)); color: var(--color-primary); border: 1px solid color-mix(in srgb, var(--color-primary) 22%, transparent); }
.tone-info    { background: var(--color-info-light);    color: var(--color-info);    border: 1px solid color-mix(in srgb, var(--color-info) 25%, transparent); }
.tone-success { background: var(--color-success-light); color: var(--color-success); border: 1px solid color-mix(in srgb, var(--color-success) 25%, transparent); }
.tone-warning { background: var(--color-warning-light); color: var(--color-warning); border: 1px solid color-mix(in srgb, var(--color-warning) 28%, transparent); }
.tone-mix     { background: color-mix(in srgb, var(--color-info) 10%, var(--color-success-light)); color: color-mix(in srgb, var(--color-info) 55%, var(--color-success)); border: 1px solid color-mix(in srgb, var(--color-info) 22%, transparent); }
:root.dark .tone-primary { color: var(--text-primary); }
.tone-system  { background: var(--bg-sidebar); color: var(--text-secondary); border: 1px solid var(--border); }

/* 主屏搜索提示（type-to-search） */
.qhint { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 5;
  display: flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 999px;
  background: var(--bg-card); border: 1px solid var(--border-strong); box-shadow: var(--shadow-card-hover);
  font-size: var(--font-size-base); color: var(--text-primary); }
.qhint .q { font-weight: 600; }
.qhint .n { color: var(--text-tertiary); font-size: var(--font-size-sm); }

/* ==================== 卡片全屏（应用视图 / 系统页共用承载） ==================== */
.cardframe { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden;
  background: var(--bg-card); }
/* 应用自带 app-bar（属于应用视图内容，不是宿主窗口装饰） */
.appbar { height: 44px; flex-shrink: 0; display: flex; align-items: center; gap: 10px;
  padding: 0 14px; border-bottom: 1px solid var(--border); background: var(--bg-card); }
.appbar .nm { font-size: var(--font-size-lg); font-weight: 600; display: flex; align-items: center; gap: 8px; }
.appbar .sub { font-size: var(--font-size-sm); color: var(--text-tertiary); }
.appbar .grow { flex: 1; min-width: 0; }
.appbody { flex: 1; min-height: 0; overflow: auto; }

/* ==================== 系统页（参考方案 B 的管理中心页面：密度优先、标准圆角） ==================== */
.sysframe { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; background: var(--bg-page); }
.sys-head { flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 10px 16px 0; }
.sys-head .t { font-size: 18px; font-weight: 650; }
.sys-head .grow { flex: 1; min-width: 0; }
.sys-tabs { flex-shrink: 0; display: flex; gap: 2px; padding: 8px 16px 0; border-bottom: 1px solid var(--border); }
.sys-tab { height: 32px; padding: 0 12px; font-size: var(--font-size-base); color: var(--text-secondary);
  border-bottom: 2px solid transparent; margin-bottom: -1px; display: flex; align-items: center; gap: 7px;
  transition: color 0.15s, border-color 0.15s; }
.sys-tab:hover { color: var(--text-primary); }
.sys-tab.on { color: var(--text-primary); border-bottom-color: var(--color-primary); font-weight: 600; }
.sys-body { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 16px 18px; }
.sys-wrap { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
/* 系统页内卡片回到标准圆角（方案 B 管理中心的密度与尺度） */
.sys-body .card { border-radius: var(--radius-card); padding: 12px 14px; }

.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-card);
  padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.card > .card-t { font-size: var(--font-size-lg); font-weight: 600; display: flex; align-items: center; gap: 8px; }
.card > .card-d { font-size: var(--font-size-sm); color: var(--text-tertiary); line-height: 1.55; }

/* 设置行 */
.row-sw { display: flex; align-items: center; gap: 10px; padding: 8px 2px; }
.row-sw + .row-sw { border-top: 1px solid var(--border); }
.row-sw .lb { flex: 1; min-width: 0; }
.row-sw .lb b { display: block; font-size: var(--font-size-base); font-weight: 500; }
.row-sw .lb span { display: block; font-size: var(--font-size-sm); color: var(--text-tertiary); margin-top: 1px; }
.row-sw.off { opacity: 0.48; }

/* 开关：原生 checkbox + token 外观，键盘可达 */
.sw { position: relative; width: 32px; height: 18px; flex-shrink: 0; }
.sw input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.sw .track { position: absolute; inset: 0; border-radius: 9px; background: var(--border-strong);
  transition: background-color 0.2s; pointer-events: none; }
.sw .knob { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%;
  background: var(--bg-card); transition: transform 0.2s; pointer-events: none; }
.sw input:checked ~ .track { background: var(--color-success); }
.sw input:checked ~ .knob { transform: translateX(14px); }
.sw input:focus-visible ~ .track { outline: 2px solid var(--color-info); outline-offset: 1px; }
.sw.risk input:checked ~ .track { background: var(--color-danger); }

/* 分段控件（主题三档 / 授权策略三档） */
.seg { display: inline-flex; gap: 2px; padding: 2px; background: var(--bg-sidebar);
  border: 1px solid var(--border); border-radius: var(--radius-button); }
.seg button { min-width: 62px; height: 24px; padding: 0 10px; border-radius: 6px;
  font-size: var(--font-size-sm); color: var(--text-tertiary); white-space: nowrap;
  transition: background-color 0.15s, color 0.15s; }
.seg button:hover { color: var(--text-primary); }
.seg button.on { background: var(--bg-card); color: var(--text-primary); font-weight: 500; box-shadow: var(--shadow-card); }
.seg button.on.risky { background: var(--color-danger-light); color: var(--color-danger); box-shadow: none; }

/* 色板卡 */
.pal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.pal-card { display: flex; flex-direction: column; gap: 6px; padding: 8px; border-radius: var(--radius-button);
  border: 1px solid var(--border); background: var(--bg-card); text-align: left; cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s; }
.pal-card:hover { border-color: var(--border-strong); }
.pal-card.on { border-color: var(--color-primary); box-shadow: var(--shadow-input-focus); }
.pal-sw { display: flex; height: 22px; border-radius: 5px; overflow: hidden; border: 1px solid var(--border); }
.pal-sw i { flex: 1; }
.pal-sw i + i { border-left: 1px solid var(--border); }
.pal-card .nm { font-size: var(--font-size-sm); color: var(--text-secondary); }
.pal-card.on .nm { color: var(--text-primary); font-weight: 500; }

/* 表单控件 */
.fld { display: flex; flex-direction: column; gap: 5px; }

<script>
/* ============================================================================
   数据：全部来自仓库真实事实（5 个 wasm-app 的 plugin.json + 真实授权读模型）
   - 权限位取自 src/plugin/permission-vocabulary.ts（SDK VALID_PERMISSIONS 生成物）
   - 高危位取自 src/plugin/contributionKinds.ts 的 HIGH_RISK_PERMISSIONS
   - 授权模型取自 src/utils/authPolicy.ts：strategies + records（四分区）+ firstPartyDirs
   - 内置免询问项逐条对齐 src-tauri/src/first_party_dirs.rs 的真实清单
   ============================================================================ */
const HIGH_RISK = ['process:run', 'pty:spawn', 'terminal:input', 'database:main'];
const STRATEGIES = ['always_ask', 'default', 'always_allow'];
const STRATEGY_LABEL = { always_ask: '总是询问', default: '按需询问', always_allow: '始终允许' };

/* ---- 通知机制（机制面） ---- */
let notifSeq = 100;
function pushNotif(n) {
  state.notifs = [{ id: 'n' + (++notifSeq), mins: 0, sticky: false, actions: [], body: '', ...n }, ...state.notifs];
}
function dismissNotif(id) { state.notifs = state.notifs.filter(n => n.id !== id); }
/* 清除全部：驻留项（sticky）与审批派生项不动，只清可清除的普通通知 */
function clearNotifs() { state.notifs = state.notifs.filter(n => n.sticky); }
/* 审批通知：从 approvalIds() 动态派生（不进 state.notifs，无独立生命周期） */
function approvalNotifs() {
  return approvalIds().map(id => {
    const a = byId(id);
    return { id: 'appr-' + id, kind: 'approval', sticky: true, icon: 'warn', source: a.name, app: id,
      title: '等待权限审批', body: `manifest 声明 ${a.granted.length} 个权限位（${a.granted.filter(isRisk).length} 个高危），批准后才会激活。`,
      mins: null, actions: [{ id: 'approve', label: '去审批' }] };
  });
}
const notifCount = () => state.notifs.length + approvalIds().length;

const approvalIds = () => Object.values(state.apps).filter(a => a.state === 'approval').map(a => a.id);
const cardKeyOf = c => c;   // 键即字符串
const cardTitle = key => {
  const [kind, id] = key.split(':');
  return kind === 'app' ? (byId(id) ? byId(id).name : id) : (SYS_PAGES.find(s => s.id === id) || {}).name || id;
};

/* ==================== 卡片模型 ==================== */
function activateCard(key) {
  state.cards = [key, ...state.cards.filter(k => k !== key)];
  state.activeCard = key;
  state.screen = 'card';
  state.panelOpen = false;
  renderAll(true);
}
function openApp(id) {
  const app = byId(id);
  if (!app) return;
  if (app.state === 'dormant') {
    app.state = 'running';
    toast(`${app.name} 已启动`);
  }
  activateCard('app:' + id);
}
function openSys(id) {
  activateCard('sys:' + id);
}
/* 关卡片：应用卡 = 停用实例（dormant）并落一条事件通知；系统页卡 = 只关页面。
   关的是当前活动卡 → 切到 MRU 次卡，无卡回主屏。silent 供「全部关闭」批量调用。 */
function closeCard(key, silent) {
  const [kind, id] = key.split(':');
  state.cards = state.cards.filter(k => k !== key);
  if (kind === 'app') {
    const app = byId(id);
    if (app && app.state !== 'approval' && app.state !== 'dormant') {
      app.state = 'dormant';
      if (!silent) {
        pushNotif({ kind: 'event', icon: 'stop', source: app.name, app: id, title: '已停止',
          body: '实例已停用，可在主屏重新打开。', actions: [{ id: 'open', label: '重新打开' }] });
        toast(`${app.name} 已停止`);
      }
    }
  }
  if (state.activeCard === key) {
    if (state.cards.length) { state.activeCard = state.cards[0]; renderAll(true); }
    else goHome();
  } else {
    renderAll();
  }
}
function goHome() {
  state.screen = 'home';
  state.activeCard = null;
  state.panelOpen = false;
  state.homeQ = '';
  renderAll(true);
}
function goBack() {
  // 覆层按 z 序先收（dialog/palette > ctx > panel），覆层耗尽后 card → home
  if (state.dialog) { state.dialog = null; renderAll(); return; }
  if (state.paletteOpen) { state.paletteOpen = false; renderAll(); return; }
  if (state.ctx) { state.ctx = null; renderAll(); return; }
  if (state.panelOpen) { state.panelOpen = false; renderAll(); return; }
  if (state.screen !== 'home') goHome();
}
function stopAllCards() {
  const n = state.cards.length;
  // forEach 会把下标当第二参数传入，必须显式包箭头函数（否则 index>0 被当 silent=true）
  [...state.cards].forEach(k => closeCard(k, true));
  if (n) {
    pushNotif({ kind: 'event', icon: 'layers', source: '宿主', title: `已关闭 ${n} 张卡片`,
      body: '应用实例已全部停用，系统页已关闭。' });
    toast(`已关闭 ${n} 张卡片`);
  }
  goHome();
}

function appDetail(a) {

    <div class="card">

            : `<button class="btn" data-act="open-app" data-app="${a.id}">${svg('play', 13)} 启动并打开</button>`}
        <button class="btn danger-outline" data-act="uninstall" data-app="${a.id}" ${running ? 'disabled title="请先停用应用后再卸载"' : ''}>
          ${svg('trash', 13)} 卸载</button>
      </div>
      ${a.state === 'approval' ? `<div class="callout danger">${svg('warn', 14)}<span>待审批：manifest 声明 ${a.granted.length} 个权限位（${riskCnt} 个高危）。批准是整单裁决，启用方向先过 <span class="mono">plugin_approve</span>。</span></div>` : ''}
    </div>

    <div class="card"><div class="card-t">${svg('shield', 15)} 授权策略</div>
      ${authStratRows(a)}
      <div class="note">策略切换不追溯已落账记录；收紧需逐条撤销。完整记录见「权限与授权」。</div>
    </div>

    <div class="card"><div class="card-t">${svg('layers', 15)} 权限位（manifest 声明 · 加载期整单裁决 · 只读）</div>
      <div style="display:flex;flex-wrap:wrap;gap:5px">
        ${a.granted.map(p => `<span class="pill ${isRisk(p) ? 'risk' : ''}">${p}</span>`).join('')}

    <div class="card"><div class="card-t">${svg('gear', 15)} 应用配置</div>
      ${cfg ? cfgForm(a, cfg) : `<div class="note">无可用的配置项（manifest contributes.configuration.properties 为空）。

function cfgForm(a, cfg) {
  return `<div style="display:flex;flex-direction:column;gap:9px">
    ${Object.entries(cfg.properties).map(([k, p]) => {
      if (p.type === 'boolean') return `<div class="row-sw"><div class="lb"><b>${p.title}</b><span class="mono">${k}</span></div>${sw('cfg-bool', p.default)}</div>`;
      if (p.enum) return `<div class="fld"><span class="lb">${p.title} <span class="mono" style="color:var(--text-tertiary)">${k}</span></span>
        <select class="inp" aria-label="${p.title}">${p.enum.map(e => `<option ${e === p.default ? 'selected' : ''}>${e}</option>`).join('')}</select></div>`;
      if (p.type === 'number' && p.minimum !== undefined) return `<div class="fld"><span class="lb">${p.title}（${p.minimum}–${p.maximum}）</span>
        <div class="size-row"><input type="range" min="${p.minimum}" max="${p.maximum}" value="${p.default}" aria-label="${p.title}"/><span class="val">${p.default}</span></div></div>`;
      return `<div class="fld"><span class="lb">${p.title}</span><input class="inp" value="${p.default}" aria-label="${p.title}"/></div>`;
    }).join('')}
    <div style="display:flex;gap:8px"><button class="mini" data-act="cfg-save" data-app="${a.id}">${svg('check', 12)} 保存</button>
      <button class="mini" data-act="cfg-reset">重置为默认</button></div>

}
function authStratRows(a) {
  return Object.entries(a.strategies).map(([res, cur]) => `
    <div class="strat-row"><span class="lb">${res === 'fs' ? svg('folder', 13) : svg('network', 13)} ${RESOURCE_LABEL[res]}</span>
      <div class="seg">${STRATEGIES.map(t => `<button class="${t === cur ? 'on' : ''} ${t === 'always_allow' && t === cur ? 'risky' : ''}"

    </div>`).join('');
}

/* ---- 系统页：权限与授权（参考方案 B 治理面的授权详情 + 四分区） ---- */
function sysPerms() {
  const apps = Object.values(state.apps).sort((x, y) => appRiskRank(x) - appRiskRank(y));
  const pending = approvalIds();
  return `
  ${pending.length ? `<div class="callout warn">${svg('warn', 14)}<span><b>${pending.length} 个应用待审批</b>：${pending.map(id => byId(id).name).join('、')}。
    审批是整单裁决——逐位勾选会让「高危位混在低位里被顺手放行」。</span>
    <button class="mini" data-act="approve" data-app="${pending[0]}" style="margin-left:auto;flex-shrink:0">去审批</button></div>` : ''}
  ${apps.map(a => {
    const ug = userGranted(a), aa = autoAllowed(a), dn = denied(a);
    return `<div class="card">
      <div class="pcard-head">
        ${iconBox(a, 34)}
        <div class="nm"><b>${a.name}</b><span>${a.granted.length} 权限位 · ${a.granted.filter(isRisk).length} 高危 · ${a.records.length} 条授权记录</span></div>
        <span class="chip ${a.state === 'approval' ? 'danger' : a.state === 'running' ? 'ok' : a.state === 'degraded' ? 'warn' : ''}">${STATE_TEXT[a.state]}</span>
      </div>
      ${authStratRows(a)}
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
        <span class="chip ok">已授权 ${ug.length}</span>
        <span class="chip warn">免询问放行 ${aa.length}</span>
        <span class="chip info">内置免询问 ${a.firstPartyDirs.length}</span>
        <span class="chip danger">硬拒绝 ${dn.length}</span>
        <span style="flex:1"></span>
        <button class="mini" data-act="detail-app-jump" data-app="${a.id}">管理</button>
      </div>
      ${authRecords(a)}
    </div>`;
  }).join('')}`;
}
function authRecords(a) {
  const sec = (t, list, cls, revocable, note) => list.length ? `
    <div class="blk-t" style="margin-top:6px">${t}<span style="flex:1;height:1px;background:var(--border)"></span>${note || ''}</div>
    ${list.map(r => `<div class="rec ${cls}">
      <span class="tg">${r.target}</span>
      <span class="chip">${RESOURCE_LABEL[r.resource]} · ${opsLabel(r.ops)}${r.prefixMatch ? ' · 前缀' : ''}</span>
      ${r.source === 'always_allow' ? '<span class="chip warn">未经确认</span>' : ''}
      ${revocable ? `<button class="mini danger" data-act="revoke" data-app="${a.id}" data-target="${r.target}">撤销</button>` : ''}
    </div>`).join('')}` : '';
  const parts = [
    sec('用户已授权', userGranted(a), '', true),
    sec('免询问自动放行', autoAllowed(a), 'unconfirmed', true),
    sec('内置免询问（第一方清单只读投影）', a.firstPartyDirs.map(e => ({ target: fpLabel(e), resource: 'fs', ops: ['read','write'], prefixMatch: true, source: 'first-party' })), '', false),
    sec('硬拒绝（命中即拒，不回退询问）', denied(a), 'deny', true),
  ].filter(Boolean);
  return parts.length ? `<div style="display:flex;flex-direction:column">${parts.join('')}</div>`
    : '<div class="note">暂无授权记录。</div>';
}

/* ==================== 渲染：通知中心（卡片式，参考手机系统通知栏） ==================== */
function notifTime(mins) { return mins === null || mins === undefined ? '' : mins === 0 ? '刚刚' : `${mins} 分钟前`; }
function notifCard(n) {
  const toneCls = n.kind === 'approval' ? 'tone-warning' : n.kind === 'progress' ? 'tone-success' : n.kind === 'info' ? 'tone-system' : 'tone-info';
  return `<div class="ntf ${n.kind === 'approval' ? 'attn' : ''}">
    <span class="ntf-ic glyph-box ${toneCls}">${svg(n.icon, 14)}</span>
    <div class="ntf-b">
      <div class="ntf-top"><b>${n.title}</b>${notifTime(n.mins) ? `<span class="ntf-time">${notifTime(n.mins)}</span>` : ''}</div>
      <div class="ntf-src">${n.source}</div>
      ${n.body ? `<div class="ntf-body">${n.body}</div>` : ''}
      ${n.kind === 'progress' ? `<div class="bar" style="margin-top:5px"><i style="width:${n.progress}%"></i></div>
        <div class="ntf-body">${n.progress}% · 3.2 MB/s</div>` : ''}
      ${(n.actions && n.actions.length) ? `<div class="ntf-acts">${n.actions.map(x =>
        `<button class="mini" data-act="notif-act" data-id="${n.id}" data-do="${x.id}">${x.label}</button>`).join('')}</div>` : ''}
    </div>
    ${n.sticky ? '' : `<button class="ntf-x" data-act="notif-x" data-id="${n.id}" aria-label="关闭通知：${n.title}">${svg('x', 11)}</button>`}
  </div>`;
}
function renderPanel() {

/* ==================== 渲染：右键菜单 ==================== */
function renderCtx() {
  const el = document.getElementById('ctx');
  if (!state.ctx) { el.hidden = true; el.innerHTML = ''; return; }
  const a = byId(state.ctx.appId);
  if (!a) { el.hidden = true; return; }

      ${svg('trash', 13)} 卸载</button>`;

/* ==================== 渲染：命令面板 ==================== */
function allCommands() {
  const cmds = [...HOST_COMMANDS];
  for (const [appId, list] of Object.entries(PLUGIN_COMMAND_TITLES)) {
    const a = byId(appId);
    if (!a) continue;
    for (const c of list) cmds.push({ id: `${appId}.${c}`, title: `${a.name}：${c}`, src: appId });
  }
  return cmds;
}
function renderPalette() {
  if (!state.paletteOpen) return '';
  const q = state.paletteQ.toLowerCase();
  const list = allCommands().filter(c => !q || c.title.toLowerCase().includes(q) || c.id.includes(q));
  if (state.paletteCur >= list.length) state.paletteCur = 0;
  let lastSrc = null;
  return `<div class="palette" role="dialog" aria-label="命令面板">
    <div class="srch">${svg('search', 15)}<input id="paletteInput" placeholder="输入命令或搜索…" value="${state.paletteQ}" aria-label="命令搜索"/></div>
    <div class="lst">
      ${list.map((c, i) => {
        const grp = c.src !== lastSrc ? `<div class="grp">${c.src === 'host' ? '宿主' : byId(c.src).name}</div>` : '';
        lastSrc = c.src;
        return `${grp}<button class="it ${i === state.paletteCur ? 'cur' : ''}" data-act="run-cmd" data-cmd="${c.id}">${svg('terminal', 12)} ${c.title}</button>`;
      }).join('') || '<div class="empty">没有匹配的命令</div>'}
    </div>
  </div>`;
}

/* ==================== 渲染：弹窗 ==================== */
function dlgShell(title, body, foot, wide, icon) {

      <button class="mini" data-act="dialog-close" aria-label="关闭弹窗">${svg('x', 12)}</button></div>
    <div class="dlg-b">${body}</div>
    ${foot ? `<div class="dlg-f">${foot}</div>` : ''}
  </div>`;
}

    case 'dir': {
      const items = [
        ['approval', '权限审批弹窗', 'shield'], ['fs-single', '文件授权 · 单路径', 'folder'],
        ['fs-picker', '文件授权 · 选择框来源', 'folder'], ['fs-batch', '文件授权 · 批量列表', 'folder'],
        ['network', '网络出站授权', 'network'], ['strategy-confirm', '「始终允许」二次确认', 'warn'],
        ['uninstall', '卸载确认', 'trash'], ['exit', '退出确认', 'exit'],
        ['loading', '加载遮罩', 'clock'], ['global', '插件全局弹窗', 'layers'],
      ];
      return dlgShell('全局弹窗目录', `
        <div class="note">宿主全局弹窗体系（10 种），逐个打开预览：</div>
        <div class="dlg-dir">${items.map(([k, l, ic]) => `<button class="mini" style="justify-content:flex-start" data-act="dialog" data-dlg="${k}">${svg(ic, 12)} ${l}</button>`).join('')}</div>`,
        `${cancel}`, true, 'layers');
    }
  }
  return '';
}
function renderOvl() {
  const el = document.getElementById('ovl');
  const inner = state.paletteOpen ? renderPalette() : renderDialog();
  el.hidden = !inner;
  el.innerHTML = inner;
  if (state.paletteOpen) {
    const inp = document.getElementById('paletteInput');
    if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
  }
}

/* ==================== Toast / 启动屏 ==================== */
function toast(msg) {
  const wrap = document.getElementById('toasts');
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `${svg('check', 13)} ${msg}`;
  wrap.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity 0.25s'; setTimeout(() => t.remove(), 260); }, 2400);
}
function renderBoot() {
  const el = document.getElementById('boot');
  el.hidden = !state.boot;
  if (!state.boot) { el.innerHTML = ''; return; }
  el.innerHTML = `
    <div class="glyph"><svg width="30" height="30" viewBox="0 0 100 100" aria-hidden="true">
      <g stroke="currentColor" stroke-width="13" stroke-linecap="round" fill="none">
        <line x1="23.2" y1="33" x2="36.8" y2="67"/><line x1="39.3" y1="67.1" x2="48.7" y2="46.9"/>
        <line x1="51.3" y1="46.9" x2="60.7" y2="67.1"/><line x1="63.2" y1="67" x2="76.8" y2="33"/>
      </g><path d="M50 36.5 L56.5 43 L50 49.5 L43.5 43 Z" fill="#FF9E2C"/></svg></div>
    <div class="line">BedCode · wasm-app 平台启动中</div>
    <div class="bar"><i style="width:72%"></i></div>
    <div class="log">
      <div><span class="ok">✓</span> wasmtime 48 引擎就绪</div>
      <div><span class="ok">✓</span> ABI 38 校验通过（form=1）</div>
      <div><span class="ok">✓</span> 已装应用注册表加载（5）</div>
      <div><span class="ok">✓</span> 授权策略层 fail-closed 自检</div>
    </div>
    <div class="note">点击任意处跳过</div>`;
}

/* ==================== renderAll ==================== */
function renderAll(animate) {
  renderToolbar();
  renderHome();
  renderCard();
  renderPanel();
  renderCtx();
  renderOvl();
  renderBoot();
  document.getElementById('scr-home').hidden = state.screen !== 'home';
  document.getElementById('scr-card').hidden = state.screen !== 'card';
  if (animate && state.settings.ui.animations_enabled) {
    const scr = document.getElementById(state.screen === 'card' ? 'scr-card' : 'scr-home');
    scr.classList.remove('entering');
    void scr.offsetWidth;   // 强制 reflow 让动画可重触发（类只是装饰，状态已先行正确）
    scr.classList.add('entering');
  }
}

/* ==================== 交互 ==================== */
document.addEventListener('click', e => {
  // 右键菜单 / 通知面板：点其他地方关闭
  if (state.ctx && !e.target.closest('.ctx')) { state.ctx = null; renderCtx(); }
  if (state.panelOpen && !e.target.closest('.panel') && !e.target.closest('[data-act="panel"]')) {
    state.panelOpen = false; renderPanel(); renderToolbar();
  }
  const t = e.target.closest('[data-act]');
  if (!t) {
    if (e.target.id === 'ovl') { state.dialog = null; state.paletteOpen = false; renderOvl(); }
    return;
  }
  const act = t.dataset.act, appId = t.dataset.app;
  const app = appId ? byId(appId) : null;
  switch (act) {
    case 'open-app': openApp(appId); break;
    case 'open-sys': openSys(t.dataset.sys); break;
    case 'resume-card': activateCard(t.dataset.key); break;
    case 'close-card': closeCard(t.dataset.key); break;
    case 'close-all': stopAllCards(); break;
    case 'home': goHome(); break;
    case 'back': goBack(); break;
    case 'panel': state.panelOpen = !state.panelOpen; renderAll(); break;
    case 'theme': {
      const dark = document.documentElement.classList.toggle('dark');
      state.settings.ui.theme = dark ? 'dark' : 'light';
      renderAll(); break;
    }
    case 'set-theme': {
      state.settings.ui.theme = t.dataset.v;
      document.documentElement.classList.toggle('dark', t.dataset.v !== 'light');
      renderAll(); break;
    }
    case 'set-palette': state.settings.ui.theme_palette = t.dataset.v; toast('色板已切换（预览固定 warm 色值）'); renderAll(); break;
    case 'set-animations': state.settings.ui.animations_enabled = !state.settings.ui.animations_enabled; renderAll(); break;
    case 'set-shownav': state.settings.ui.show_nav = !state.settings.ui.show_nav; renderAll(); break;
    case 'set-wall': state.settings.ui.wallpaper = t.dataset.v; renderAll(); break;
    case 'wall-custom': toast('选择图片文件（预览不读盘；正式实现走 fs:pick 授权后由宿主下发）'); break;
    case 'notif-x': dismissNotif(t.dataset.id); renderAll(); break;
    case 'notif-clear': clearNotifs(); toast('已清除可清除的通知（驻留与待审批项保留）'); renderAll(); break;
    case 'notif-act': {
      const n = state.notifs.find(x => x.id === t.dataset.id) || approvalNotifs().find(x => x.id === t.dataset.id);
      if (!n) break;
      if (t.dataset.do === 'approve' && n.app) {
        state.panelOpen = false; state.dialog = 'approval'; state.dlgApp = n.app; renderAll();
      } else if (t.dataset.do === 'open' && n.app) {
        openApp(n.app);
      }
      break;
    }
    case 'set-preventsleep': state.settings.network.prevent_sleep = !state.settings.network.prevent_sleep; renderAll(); break;
    case 'crypto-enabled': case 'crypto-toggle': state.crypto.enabled = !state.crypto.enabled; renderAll(); break;
    case 'crypto-encrypt_http': case 'crypto-encrypt_ws_terminal': case 'crypto-encrypt_ws_event': case 'crypto-allow_plaintext_fallback': {
      const k = act.slice(7); state.crypto[k] = !state.crypto[k]; renderAll(); break;
    }
    case 'detail-app': state.detailApp = appId; renderAll(); break;
    case 'detail-app-jump': state.detailApp = appId; openSys('apps'); break;
    case 'perms-app-jump': openSys('perms'); break;
    case 'install': toast('plugin_install_from_file：选择本地 zip'); break;
    case 'stop-app': {
      // 停用 = 关应用卡（若开着）+ 实例置 dormant（走 closeCard 同一路径，通知语义一致）
      if (state.cards.includes('app:' + appId)) {
        closeCard('app:' + appId);
      } else if (app && app.state !== 'approval') {
        app.state = 'dormant';
        pushNotif({ kind: 'event', icon: 'stop', source: app.name, app: appId, title: '已停止',
          body: '实例已停用，可在主屏重新打开。', actions: [{ id: 'open', label: '重新打开' }] });
        toast(`${app.name} 已停止`);
        renderAll();
      }
      break;
    }
    case 'approve': state.dialog = 'approval'; state.dlgApp = appId; renderAll(); break;
    case 'approve-ok': {
      app.state = 'running';
      state.dialog = null;
      toast(`${app.name} 已批准并启动（plugin_approve 整单裁决）`);
      pushNotif({ kind: 'event', icon: 'check', source: app.name, app: appId, title: '已批准并启动',
        body: '审批通知随之消失（派生自 approvalIds，无独立生命周期）。' });
      openApp(appId); break;
    }
    case 'uninstall': state.dialog = 'uninstall'; state.dlgApp = appId; state.ctx = null; renderAll(); break;
    case 'uninstall-ok': {
      delete state.apps[appId];
      state.cards = state.cards.filter(k => k !== 'app:' + appId);
      if (state.activeCard === 'app:' + appId) {
        state.activeCard = state.cards[0] || null;
        if (!state.activeCard) state.screen = 'home';
      }
      state.dialog = null;
      toast('已卸载：安装目录 + 存储 + 启用状态已删除');
      renderAll(); break;
    }
    case 'set-strategy': {
      const v = t.dataset.v;
      if (v === 'always_allow' && app.strategies[t.dataset.res] !== 'always_allow') {
        state.dialog = 'strategy-confirm'; state.dlgApp = appId; state.dlgRes = t.dataset.res; renderAll(); break;
      }
      app.strategies[t.dataset.res] = v;
      toast('策略已更新（plugin_auth_set_strategy，需宿主凭证）');
      renderAll(); break;
    }
    case 'strategy-confirm-ok': {
      byId(state.dlgApp).strategies[state.dlgRes] = 'always_allow';
      state.dialog = null;
      toast('已切换为「始终允许」：新请求免询问放行，存量记录不变');
      renderAll(); break;
    }
    case 'revoke': {
      const a2 = byId(appId);
      a2.records = a2.records.filter(r => r.target !== t.dataset.target);
      toast('已撤销（plugin_auth_revoke，下次访问重新询问）');
      renderAll(); break;
    }
    case 'cfg-save': toast('配置已保存（plugin config 写入插件存储）'); break;
    case 'cfg-reset': toast('已重置为默认值'); break;
    case 'palette': state.paletteOpen = true; state.paletteQ = ''; state.paletteCur = 0; renderAll(); break;
    case 'run-cmd': {
      state.paletteOpen = false;
      const id = t.dataset.cmd;
      if (id === 'host.home') goHome();
      else if (id === 'host.settings.open') openSys('settings');
      else if (id === 'host.apps.open') openSys('apps');
      else if (id === 'host.perms.open') openSys('perms');
      else if (id === 'host.dialogs.open') { state.dialog = 'dir'; renderAll(); }
      else if (id === 'host.boot.replay') { state.boot = true; renderAll(); }
      else { toast(`已执行：${id}`); renderAll(); }
      break;
    }
    case 'dialog': state.dialog = t.dataset.dlg; if (!state.dlgApp) state.dlgApp = state.detailApp; state.paletteOpen = false; renderAll(); break;
    case 'dialog-close': state.dialog = null; renderAll(); break;
    case 'boot': state.boot = true; renderAll(); break;
    case 'log-dir': toast('打开日志目录（宿主命令）'); break;
    case 'update-check': toast('已是最新版本'); break;
    case 'win-min': toast('最小化（预览无实际操作）'); break;
    case 'win-max': toast('最大化（预览无实际操作）'); break;
    case 'win-close': state.dialog = 'exit'; renderAll(); break;
  }
});

/* 右键：应用图标上下文菜单 */
document.addEventListener('contextmenu', e => {
  const ic = e.target.closest('[data-ctx]');
  if (!ic) return;
  e.preventDefault();
  state.ctx = { appId: ic.dataset.ctx, x: e.clientX, y: e.clientY };
  renderCtx();
});

/* 键盘 */
document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.shiftKey && (e.key === 'P' || e.key === 'p')) {
    e.preventDefault(); state.paletteOpen = !state.paletteOpen; state.paletteQ = ''; state.paletteCur = 0; renderAll(); return;
  }
  if (mod && e.key === ',') { e.preventDefault(); openSys('settings'); return; }
  if (state.boot && (e.key === 'Escape' || e.key === 'Enter')) { state.boot = false; renderAll(); return; }
  if (state.paletteOpen) {
    const list = allCommands().filter(c => !state.paletteQ || c.title.toLowerCase().includes(state.paletteQ.toLowerCase()) || c.id.includes(state.paletteQ.toLowerCase()));
    if (e.key === 'Escape') { state.paletteOpen = false; renderAll(); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); state.paletteCur = Math.max(0, Math.min(state.paletteCur + 1, list.length - 1)); renderAll(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); state.paletteCur = Math.max(0, state.paletteCur - 1); renderAll(); }
    else if (e.key === 'Enter' && list[state.paletteCur]) {
      state.paletteOpen = false; toast(`已执行：${list[state.paletteCur].id}`); renderAll();
    }
    return;
  }
  if (e.key === 'Escape') { goBack(); return; }
  if (state.dialog || state.ctx || state.panelOpen) return;
  // 主屏 type-to-search：可打印字符累积成查询串（IME 合成中的 CJK 走真实输入框时才可得，
  // 全局 keydown 收不到 composition——预览以 ASCII 验证路径，正式实现挂隐藏 input）
  if (state.screen === 'home' && !mod && !e.altKey && e.key.length === 1) {
    state.homeQ += e.key;
    renderAll();
  } else if (state.screen === 'home' && e.key === 'Backspace') {
    state.homeQ = state.homeQ.slice(0, -1);
    renderAll();
  } else if (state.screen === 'home' && e.key === 'Enter' && state.homeQ) {
    const q = state.homeQ.toLowerCase();
    const hitApp = Object.values(state.apps).find(a => a.name.toLowerCase().includes(q) || a.id.includes(q) || a.pid.includes(q));
    const hitSys = SYS_PAGES.find(s => s.name.toLowerCase().includes(q) || s.id.includes(q));
    state.homeQ = '';
    if (hitApp) openApp(hitApp.id);
    else if (hitSys) openSys(hitSys.id);
    else renderAll();
  }
});

/* 命令面板与设置控件的输入事件 */
document.addEventListener('input', e => {
  if (e.target.id === 'paletteInput') {
    state.paletteQ = e.target.value; state.paletteCur = 0;
    renderOvl();
    const inp = document.getElementById('paletteInput');
    if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
    return;
  }
  const act = e.target.dataset && e.target.dataset.actInp;
  if (!act) return;
  if (act === 'set-fontsize') { state.settings.ui.font_size = Number(e.target.value); renderAll(); }
  else if (act === 'wall-dim') { state.settings.ui.wall_dim = Number(e.target.value) / 100; renderAll(); }
  else if (act === 'set-language') { state.settings.ui.language = e.target.value; toast('界面语言已切换（预览固定中文文案）'); }
  else if (act === 'set-port') { state.settings.network.port = Number(e.target.value) || 0; }
  else if (act.startsWith('log-')) toast('日志设置已更新');
});

/* 启动屏：点击跳过 */
document.getElementById('boot').addEventListener('click', () => { state.boot = false; renderAll(); });

/* ==================== 启动 ==================== */
renderAll();
setTimeout(() => { if (state.boot) { state.boot = false; renderAll(); } }, 2600);

/* 测试钩子（DOM 桩 / 浏览器审计驱动用，不影响交互） */
window.__C = { state, openApp, openSys, goHome, goBack, closeCard, activateCard, renderAll, allCommands, byId, userGranted, autoAllowed, denied, cardTitle, pushNotif, dismissNotif, clearNotifs, approvalNotifs, notifCount };
</script>
</body>
