<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WasmApp Desktop — 方案 B：分屏平铺工作区</title>
<style>
/* ============================================================================
   设计 token：全部取自 bedcode-desktop/src/style.css（:root warm 色板 + :root.dark）
   零新增 hex / 零新字体族 / 零 Google Fonts（frontend-styles token-bound 铁律）
   语义色一律用 --color-{success,warning,danger,info} + *-light 变体
   ============================================================================ */
:root {
  color-scheme: light;

  --font: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, system-ui, sans-serif;
  --mono: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace;

  /* 与 style.css 同源的字号档（基准 12px），此处不叠加 --ui-scale 以保证预览尺寸可读 */
  --font-size-xs: 9px;
  --font-size-sm: 10px;
  --font-size-base: 12px;
  --font-size-lg: 14px;
  --font-size-xl: 16px;

  --bg-page: #f5f4f0;
  --bg-sidebar: #efede7;
  --bg-card: #fdfcfa;
  --bg-hover: #e7e4dc;
  --bg-input: #fdfcfa;

  --text-primary: #26231b;
  --text-secondary: #7c7565;
  --text-tertiary: #aba492;

  --border: #e4e1d8;
  --border-strong: #d6d2c4;
  --border-input: #d6d2c4;

  --color-primary: #1d1a14;
  --color-primary-hover: #0f0d09;
  --color-primary-light: #efede5;
  --color-primary-contrast: #fdfcfa;

  --color-success: #22c55e;
  --color-success-light: rgba(34, 197, 94, 0.14);
  --color-warning: #f59e0b;
  --color-warning-light: rgba(245, 158, 11, 0.16);
  --color-danger: #ef4444;
  --color-danger-light: rgba(239, 68, 68, 0.12);
  --color-info: #2563eb;
  --color-info-light: rgba(37, 99, 235, 0.12);

  --radius-card: 10px;
  --radius-button: 8px;
  --radius-input: 8px;
  --radius-tag: 6px;
  --radius-nav: 8px;

  --shadow-card: 0 1px 2px rgba(38, 35, 27, 0.04);
  --shadow-card-hover: 0 4px 16px rgba(38, 35, 27, 0.08);
  --shadow-input-focus: 0 0 0 3px rgba(29, 26, 20, 0.08);

  /* 布局尺寸（本地布局常量，非视觉 token） */
  --rail-w: 56px;
  --titlebar-h: 40px;
  --statusbar-h: 26px;
  --inspector-w: 280px;
}
:root.dark {
  color-scheme: dark;
  --bg-page: #15130f;
  --bg-sidebar: #191712;
  --bg-card: #1d1a15;
  --bg-hover: #2a261e;
  --bg-input: #1d1a15;
  --text-primary: #ece8dc;
  --text-secondary: #9c9482;
  --text-tertiary: #6b6455;
  --border: #2e2a22;
  --border-strong: #3c372b;
  --border-input: #3c372b;
  --color-primary: #ece8dc;
  --color-primary-hover: #f5f2ea;
  --color-primary-light: rgba(236, 232, 220, 0.12);
  --color-primary-contrast: #15130f;
  --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.2);
  --shadow-card-hover: 0 4px 16px rgba(0, 0, 0, 0.35);
  --shadow-input-focus: 0 0 0 3px rgba(236, 232, 220, 0.1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font);
  font-size: var(--font-size-base);
  background: var(--bg-page);
  color: var(--text-primary);
  height: 100vh;
  overflow: hidden;
  line-height: 1.5;
  transition: background-color 0.2s, color 0.2s, border-color 0.2s;
}

button { font-family: inherit; font-size: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input { font-family: inherit; font-size: inherit; }
svg { display: block; flex-shrink: 0; }

/* 焦点可见：键盘导航必须看得见落点（ui-ux-pro-max pre-delivery checklist） */
:focus-visible { outline: 2px solid var(--color-info); outline-offset: 1px; border-radius: 3px; }
:focus:not(:focus-visible) { outline: none; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
}

/* ==================== 标题栏 ==================== */
.titlebar {
  height: var(--titlebar-h); flex-shrink: 0;
  background: var(--bg-card); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px; padding: 0 8px 0 14px;
  user-select: none;
}
.brand { display: flex; align-items: center; gap: 9px; flex-shrink: 0; }
.brand b { font-size: var(--font-size-lg); font-weight: 600; letter-spacing: -0.01em; }
.brand small { font-size: var(--font-size-sm); color: var(--text-tertiary); font-weight: 400; }

/* 工作区工具条：布局预设切换（多 app 同屏展示的主控） */
.ws-tools { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.ws-label { font-size: var(--font-size-sm); color: var(--text-tertiary); letter-spacing: 0.08em; text-transform: uppercase; }
.layout-group { display: flex; align-items: center; gap: 1px; padding: 2px; background: var(--bg-sidebar); border: 1px solid var(--border); border-radius: var(--radius-button); }
.layout-btn {
  width: 28px; height: 22px; border-radius: 5px; color: var(--text-tertiary);
  display: flex; align-items: center; justify-content: center;
  transition: background-color 0.15s, color 0.15s;
}
.layout-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
.layout-btn.on { background: var(--bg-card); color: var(--text-primary); box-shadow: var(--shadow-card); }

.tbtns { display: flex; align-items: center; gap: 2px; margin-left: auto; flex-shrink: 0; }
.tbtn { width: 34px; height: 28px; border-radius: 6px; color: var(--text-secondary);
  display: flex; align-items: center; justify-content: center; transition: background-color 0.15s, color 0.15s; }
.tbtn:hover { background: var(--bg-hover); color: var(--text-primary); }

/* ==================== 主体 ==================== */
.body { display: flex; height: calc(100vh - var(--titlebar-h) - var(--statusbar-h)); }

/* ---- 左：导航轨（可折叠两态 + 可拖拽调宽） ----
   折叠态 = 56px 图标轨；展开态 = 带文字列表。宽度存 --rail-w，
   拖到 <120px 自动折叠、松手不回弹（对齐现有 Sidebar 的行为约定）。 */
.rail {
  width: var(--rail-w); flex-shrink: 0; background: var(--bg-sidebar);
  border-right: 1px solid var(--border); display: flex; flex-direction: column;
  align-items: stretch; padding: 8px 6px; gap: 2px; position: relative;
  overflow: hidden; user-select: none;
}
.rail-grab { position: absolute; top: 0; bottom: 0; right: -3px; width: 6px; cursor: col-resize; z-index: 10; }
.rail-grab:hover, .rail-grab.dragging { background: var(--color-info); }
.rail-label { font-size: var(--font-size-xs); color: var(--text-tertiary); letter-spacing: 0.1em;
  padding: 8px 8px 3px; flex-shrink: 0; }
.rail[data-collapsed='1'] .rail-label { display: none; }
.rail-sep { height: 1px; background: var(--border); margin: 6px 8px; flex-shrink: 0; }
.rail[data-collapsed='1'] .rail-sep { margin: 6px 13px; }
.rail-spacer { flex: 1; }

.ic-btn {
  min-height: 36px; border-radius: var(--radius-nav); position: relative;
  display: flex; align-items: center; gap: 9px; padding: 0 8px; width: 100%;
  color: var(--text-secondary); text-align: left;
  transition: background-color 0.15s, color 0.15s;
}
.ic-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
.ic-btn.on { background: var(--bg-card); color: var(--text-primary); box-shadow: var(--shadow-card); }
.ic-btn .ic { position: relative; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.ic-btn .rl { font-size: var(--font-size-base); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
/* 折叠态只留图标 */
.rail[data-collapsed='1'] .ic-btn { justify-content: center; padding: 0; }
.rail[data-collapsed='1'] .ic-btn .rl { display: none; }
.ic-btn .ic .dot { position: absolute; right: -1px; bottom: -1px; width: 6px; height: 6px; border-radius: 50%;
  background: var(--color-success); box-shadow: 0 0 0 2px var(--bg-sidebar); }
.ic-btn .ic .dot.degraded { background: var(--color-warning); }
.ic-btn .ic .dot.dormant { background: var(--text-tertiary); }
.ic-btn .ic .dot.approval { background: var(--color-danger); }
.ic-btn .ic .badge-n { position: absolute; left: -5px; top: -5px; min-width: 13px; height: 13px; padding: 0 3px;
  border-radius: 7px; background: var(--color-danger); color: var(--color-primary-contrast);
  font-size: var(--font-size-xs); font-weight: 600; display: flex; align-items: center; justify-content: center; }
/* 服务状态灯（5s 轮询 get_server_status）——折叠态时随导航一并隐藏 */
.rail-foot { border-top: 1px solid var(--border); margin-top: 6px; padding-top: 6px; flex-shrink: 0; }
.rail[data-collapsed='1'] .rail-foot .lamp-txt { display: none; }
.rail[data-collapsed='1'] .rail-foot .lamp { justify-content: center; padding: 9px 0; }
.ic-btn.dormant { color: var(--text-tertiary); }
.lamp { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: var(--radius-button);
  width: 100%; color: var(--text-secondary); font-size: var(--font-size-sm); text-align: left;
  transition: background-color 0.15s, color 0.15s; }
.lamp:hover { background: var(--bg-hover); color: var(--text-primary); }

/* ---- 中：舞台 ---- */
.stage-wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg-page); }
.stage { flex: 1; min-height: 0; display: flex; padding: 8px; gap: 0; }

/* 分屏树 */
.split { display: flex; flex: 1; min-width: 0; min-height: 0; gap: 0; }
.split.dir-h { flex-direction: row; }
.split.dir-v { flex-direction: column; }
.split > .node { min-width: 0; min-height: 0; display: flex; }
.gutter { flex-shrink: 0; position: relative; z-index: 5; }
.dir-h > .gutter { width: 8px; cursor: col-resize; }
.dir-v > .gutter { height: 8px; cursor: row-resize; }
.gutter::after { content: ''; position: absolute; background: transparent; transition: background-color 0.15s; }
.dir-h > .gutter::after { top: 0; bottom: 0; left: 3px; right: 3px; }
.dir-v > .gutter::after { left: 0; right: 0; top: 3px; bottom: 3px; }
.gutter:hover::after, .gutter:focus-visible::after, .gutter.dragging::after { background: var(--color-info); }
.gutter:focus-visible { outline: none; }
.gutter:focus-visible::after { background: var(--color-info); }

/* 面板（= 一个 wasm-app 的独立界面承载位） */
.pane {
  flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-card);
  box-shadow: var(--shadow-card); overflow: hidden;
  transition: box-shadow 0.2s, border-color 0.2s;
}
.pane.focused { border-color: var(--border-strong); box-shadow: var(--shadow-card-hover); }
.pane-head {
  height: 34px; flex-shrink: 0; display: flex; align-items: center; gap: 8px;
  padding: 0 6px 0 10px; border-bottom: 1px solid var(--border); background: var(--bg-card);
}
.pane-head .nm { font-size: var(--font-size-base); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pane-head .meta { font-size: var(--font-size-sm); color: var(--text-tertiary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.pane-head .grow { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }
.pane-acts { display: flex; align-items: center; gap: 1px; flex-shrink: 0; }
.pact { width: 24px; height: 22px; border-radius: 5px; color: var(--text-tertiary);
  display: flex; align-items: center; justify-content: center; transition: background-color 0.15s, color 0.15s; }
.pact:hover { background: var(--bg-hover); color: var(--text-primary); }
.pact.danger:hover { background: var(--color-danger-light); color: var(--color-danger); }
.pane-body { flex: 1; min-height: 0; overflow: auto; padding: 12px; }
.pane-body.flush { padding: 0; }

.chip { font-size: var(--font-size-sm); padding: 2px 7px; border-radius: var(--radius-tag);
  background: var(--color-primary-light); color: var(--text-secondary); white-space: nowrap; flex-shrink: 0; }
.chip.ok { background: var(--color-success-light); color: var(--color-success); }
.chip.warn { background: var(--color-warning-light); color: var(--color-warning); }
.chip.danger { background: var(--color-danger-light); color: var(--color-danger); }
.chip.info { background: var(--color-info-light); color: var(--color-info); }

.sdot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.sdot.running { background: var(--color-success); }
.sdot.degraded { background: var(--color-warning); }
.sdot.dormant { background: var(--text-tertiary); }
.sdot.approval { background: var(--color-danger); }
.sdot.error { background: var(--color-danger); }

/* ---- 各 app 独立界面 mock（证明「每个 app 有自己的界面形态」） ---- */
/* 终端面板：底色与前景全部走 token——与真实实现一致（TerminalPreview 的 --term-bg
   由宿主容器 backgroundColor 下发，本身不引入独立色值，见 wasm-apps/terminal-session
   src/components/terminal/TerminalPreview.vue）。双主题靠 token 自动反色，无 dark: 覆盖。 */
.term { height: 100%; padding: 12px 14px; border-radius: 8px; background: var(--bg-sidebar);
  font-family: var(--mono); font-size: var(--font-size-base); line-height: 1.7;
  color: var(--text-primary); overflow: auto; }
.term .p { color: var(--color-success); }
/* 光标用样式块而非 ▉ 字形：等宽字体缺该字形时字形会掉成豆腐块 */
.term .cur { display: inline-block; width: 7px; height: 1.05em; vertical-align: text-bottom;
  background: var(--color-success); border-radius: 1px; }
.term .c { color: var(--text-tertiary); }
.term .w { color: var(--color-warning); }

.chat { height: 100%; display: flex; flex-direction: column; gap: 8px; }
.chat-log { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 82%; padding: 8px 10px; border-radius: 9px; font-size: var(--font-size-base); line-height: 1.6; }
.msg.u { margin-left: auto; background: var(--color-primary-light); }
.msg.a { background: var(--bg-input); border: 1px solid var(--border); }
.composer { display: flex; gap: 6px; flex-shrink: 0; }
.composer input { flex: 1; min-width: 0; height: 30px; padding: 0 10px; background: var(--bg-input);
  border: 1px solid var(--border-input); border-radius: var(--radius-input); color: var(--text-primary); outline: none; }
.composer input:focus { border-color: var(--border-strong); box-shadow: var(--shadow-input-focus); }
.btn { height: 28px; padding: 0 12px; border-radius: var(--radius-button); background: var(--color-primary);
  color: var(--color-primary-contrast); font-size: var(--font-size-base); font-weight: 500;
  transition: background-color 0.15s; white-space: nowrap; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn:hover { background: var(--color-primary-hover); }
.btn.ghost { background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border-strong); }
.btn.ghost:hover { background: var(--bg-hover); }
.btn.danger { color: var(--color-danger); }
.btn.wide { width: 100%; }

.frow { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: var(--radius-button);
  transition: background-color 0.12s; }
.frow:hover { background: var(--bg-hover); }
.frow .fico { width: 28px; height: 28px; border-radius: 7px; background: var(--color-primary-light);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--text-secondary); }
.frow .nm { flex: 1; min-width: 0; font-size: var(--font-size-base); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.frow .mt { font-size: var(--font-size-sm); color: var(--text-tertiary); white-space: nowrap; }
.bar { height: 3px; border-radius: 2px; background: var(--border); overflow: hidden; margin-top: 3px; }
.bar i { display: block; height: 100%; border-radius: 2px; background: var(--color-success); transition: width 0.25s; }

.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-card); padding: 12px; }

/* 空态（面板关闭 / 未启动） */
.empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; color: var(--text-tertiary); text-align: center; padding: 16px; }

/* ---- 宿主自有面：工作区总览 ---- */
.ov-grid { flex: 1; min-height: 0; overflow: auto; display: grid; gap: 10px; padding: 12px;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); align-content: start; }
.ov-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-card);
  padding: 12px; display: flex; flex-direction: column; gap: 8px; text-align: left;
  transition: border-color 0.2s, box-shadow 0.2s; }
.ov-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-card-hover); }
.ov-top { display: flex; align-items: center; gap: 8px; }
.ov-top .nm { font-weight: 600; font-size: var(--font-size-lg); flex: 1; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ov-stats { display: flex; gap: 12px; font-size: var(--font-size-sm); color: var(--text-tertiary); }
.ov-perm { display: flex; flex-wrap: wrap; gap: 4px; }
.pill { font-family: var(--mono); font-size: var(--font-size-xs); padding: 1px 5px; border-radius: 4px;
  background: var(--bg-sidebar); border: 1px solid var(--border); color: var(--text-secondary); }
.pill.risk { background: var(--color-danger-light); border-color: transparent; color: var(--color-danger); }

/* ---- 宿主自有面：应用治理（启停 · 卸载 · 授权详情 · 授权策略） ---- */
.gov { flex: 1; min-height: 0; display: flex; gap: 8px; padding: 8px; }
.gov-list { width: 296px; flex-shrink: 0; display: flex; flex-direction: column; gap: 6px;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-card); overflow: hidden; }
.gov-list-head { padding: 10px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center;
  gap: 8px; flex-shrink: 0; }
.gov-list-head .t { font-weight: 600; font-size: var(--font-size-lg); flex: 1; min-width: 0; }
.gov-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.gov-row { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: var(--radius-button);
  border: 1px solid transparent; text-align: left; transition: background-color 0.15s, border-color 0.15s; }
.gov-row:hover { background: var(--bg-hover); }
.gov-row.on { background: var(--bg-sidebar); border-color: var(--border-strong); }
.gov-row .nm { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.gov-row .nm b { font-size: var(--font-size-base); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gov-row .nm span { font-size: var(--font-size-sm); color: var(--text-tertiary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.gov-detail { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-card); overflow: hidden; }
.gov-detail-head { padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center;
  gap: 10px; flex-shrink: 0; }
.gov-detail-head .nm { font-weight: 600; font-size: var(--font-size-xl); }
.gov-scroll-y { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 14px; }
.blk { display: flex; flex-direction: column; gap: 7px; }
.blk-h { display: flex; align-items: center; gap: 8px; }
.blk-h .t { font-size: var(--font-size-xs); color: var(--text-tertiary); letter-spacing: 0.08em; text-transform: uppercase; }
.blk-h .grow { flex: 1; }
.blk-body { background: var(--bg-sidebar); border: 1px solid var(--border); border-radius: var(--radius-button); padding: 10px; }

/* 授权策略：三档分段控件（总是询问 / 按需询问 / 始终允许） */
.strat-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; }
.strat-row + .strat-row { border-top: 1px solid var(--border); }
.strat-row .lb { font-size: var(--font-size-base); width: 84px; flex-shrink: 0; }
.seg { display: flex; gap: 1px; padding: 2px; background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-button); flex: 1; }
.seg button { flex: 1; height: 24px; border-radius: 5px; font-size: var(--font-size-sm);
  color: var(--text-tertiary); transition: background-color 0.15s, color 0.15s; white-space: nowrap; }
.seg button:hover { background: var(--bg-hover); color: var(--text-primary); }
.seg button.on { background: var(--color-primary-light); color: var(--text-primary); font-weight: 500; }
.seg button.on.risky { background: var(--color-danger-light); color: var(--color-danger); }

/* 授权记录行 */
.rec { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: var(--radius-button);
  background: var(--bg-card); border: 1px solid var(--border); }
.rec + .rec { margin-top: 5px; }
.rec .tg { font-family: var(--mono); font-size: var(--font-size-sm); flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rec.deny { border-color: color-mix(in srgb, var(--color-danger) 35%, transparent); }
.rec.deny .tg { color: var(--color-danger); }
.rec.unconfirmed { border-color: color-mix(in srgb, var(--color-warning) 40%, transparent); }
.mini { height: 22px; padding: 0 8px; border-radius: 5px; font-size: var(--font-size-sm);
  border: 1px solid var(--border-strong); color: var(--text-secondary); background: var(--bg-card); flex-shrink: 0;
  transition: background-color 0.15s, color 0.15s; white-space: nowrap; }
.mini:hover { background: var(--bg-hover); color: var(--text-primary); }
.mini.danger { color: var(--color-danger); border-color: color-mix(in srgb, var(--color-danger) 35%, transparent); }
.mini.danger:hover { background: var(--color-danger-light); }

.op-row { display: flex; gap: 6px; }
/* 提示块：给告警类信息一个边界，避免裸红字漂在版面上 */
.callout { display: flex; align-items: flex-start; gap: 7px; padding: 8px 9px; font-size: var(--font-size-sm);
  line-height: 1.5; border-radius: var(--radius-button); }
.callout svg { margin-top: 1px; }
.callout.danger { background: var(--color-danger-light); color: var(--color-danger);
  border: 1px solid color-mix(in srgb, var(--color-danger) 30%, transparent); }
.callout.warn { background: var(--color-warning-light); color: var(--color-warning);
  border: 1px solid color-mix(in srgb, var(--color-warning) 30%, transparent); }
/* 危险动作：与其他按钮同形状，只换语义色，不再用「纯红字无边框」 */
.btn.danger-outline { background: var(--bg-card); color: var(--color-danger);
  border: 1px solid color-mix(in srgb, var(--color-danger) 40%, transparent); }
.btn.danger-outline:hover { background: var(--color-danger-light); }
.btn.danger-outline:disabled { opacity: 0.45; cursor: not-allowed; }


/* ---- 右：检查器 ---- */
.inspector { width: var(--inspector-w); flex-shrink: 0; background: var(--bg-sidebar);
  border-left: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.insp-tabs { display: flex; flex-shrink: 0; border-bottom: 1px solid var(--border); padding: 0 6px; gap: 2px; }
.insp-tab { flex: 1; height: 32px; border-radius: 6px 6px 0 0; font-size: var(--font-size-sm);
  color: var(--text-tertiary); display: flex; align-items: center; justify-content: center; gap: 5px;
  transition: background-color 0.15s, color 0.15s; }
.insp-tab:hover { background: var(--bg-hover); color: var(--text-primary); }
.insp-tab.on { color: var(--text-primary); background: var(--bg-card); box-shadow: inset 0 -1px 0 var(--border); }
.insp-body { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 12px; }
.sec-t { font-size: var(--font-size-xs); color: var(--text-tertiary); letter-spacing: 0.08em; text-transform: uppercase; }
.kv { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-size: var(--font-size-base); padding: 3px 0; }
.kv b { font-weight: 500; flex-shrink: 0; }
.kv span { color: var(--text-secondary); text-align: right; min-width: 0; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: var(--font-size-sm); }
.meter { padding: 2px 0 6px; }
.meter .lb { display: flex; justify-content: space-between; font-size: var(--font-size-sm); color: var(--text-secondary); margin-bottom: 3px; }
.meter .tr { height: 5px; border-radius: 3px; background: var(--border); overflow: hidden; }
.meter .tr i { display: block; height: 100%; border-radius: 3px; background: var(--color-info); transition: width 0.25s; }
.meter .tr.warn i { background: var(--color-warning); }
.meter .tr.danger i { background: var(--color-danger); }
.rule { height: 1px; background: var(--border); }

/* 开关：原生 checkbox + token 化外观，键盘可达 */
.sw { position: relative; width: 30px; height: 17px; flex-shrink: 0; }
.sw input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.sw .track { position: absolute; inset: 0; border-radius: 9px; background: var(--border-strong);
  transition: background-color 0.2s; pointer-events: none; }
.sw .knob { position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%;
  background: var(--bg-card); transition: transform 0.2s; pointer-events: none; }
.sw input:checked ~ .track { background: var(--color-success); }
.sw input:checked ~ .knob { transform: translateX(13px); }
.sw input:focus-visible ~ .track { box-shadow: var(--shadow-input-focus); outline: 2px solid var(--color-info); outline-offset: 1px; }
.sw.risk input:checked ~ .track { background: var(--color-danger); }

.note { font-size: var(--font-size-sm); color: var(--text-tertiary); line-height: 1.5; }
.note.warn { color: var(--color-warning); }
.note.danger { color: var(--color-danger); }

/* 通道条目 */
.chan { display: flex; flex-direction: column; gap: 3px; padding: 7px 8px; border-radius: var(--radius-button);
  background: var(--bg-card); border: 1px solid var(--border); }
.chan .top { display: flex; align-items: center; gap: 6px; }
.chan .top .t { font-size: var(--font-size-sm); font-weight: 600; flex: 1; min-width: 0; }
.chan code { font-family: var(--mono); font-size: var(--font-size-xs); color: var(--text-secondary);
  overflow-wrap: anywhere; }

/* ==================== 状态栏 ==================== */
.statusbar { height: var(--statusbar-h); flex-shrink: 0; background: var(--bg-card);
  border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between;
  padding: 0 12px; font-size: var(--font-size-sm); color: var(--text-secondary); user-select: none; }
.statusbar .grp { display: flex; align-items: center; gap: 14px; min-width: 0; }
.statusbar .it { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
.statusbar .mono { font-family: var(--mono); }
.badge-live { display: inline-flex; align-items: center; gap: 5px; }

/* ==================== Toast（提交反馈：loading → success） ==================== */
.toast-wrap { position: fixed; bottom: 38px; left: 50%; transform: translateX(-50%);
  z-index: 50; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
.toast { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: var(--radius-button);
  background: var(--bg-card); border: 1px solid var(--border); box-shadow: var(--shadow-card-hover);
  font-size: var(--font-size-base); animation: rise 0.2s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ==================== 管理中心（应用 · 服务器 · 设置） ==================== */
.mgmt { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 8px; }
.mgmt-tabs { display: flex; gap: 2px; padding: 3px; background: var(--bg-sidebar);
  border: 1px solid var(--border); border-radius: var(--radius-button); flex-shrink: 0; align-self: flex-start; }
.mgmt-tabs button { height: 26px; padding: 0 14px; border-radius: 6px; font-size: var(--font-size-base);
  color: var(--text-secondary); display: flex; align-items: center; gap: 6px;
  transition: background-color 0.15s, color 0.15s; }
.mgmt-tabs button:hover { background: var(--bg-hover); color: var(--text-primary); }
.mgmt-tabs button.on { background: var(--bg-card); color: var(--text-primary); font-weight: 500; box-shadow: var(--shadow-card); }
.mgmt-pane { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
.pane-scroll { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }

/* 服务器：状态灯 + 三格指标 */
.srv-head { display: flex; align-items: center; gap: 12px; padding: 12px 14px; flex-shrink: 0; flex-wrap: wrap; }
.lamp-big { display: flex; align-items: center; gap: 9px; }
.lamp-big .t { font-size: var(--font-size-xl); font-weight: 600; }
.lamp-big .up { font-size: var(--font-size-sm); color: var(--text-tertiary); font-family: var(--mono); }
.stat3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-left: auto; }
.stat3 > div { text-align: right; }
.stat3 .n { font-size: var(--font-size-xl); font-weight: 600; font-variant-numeric: tabular-nums; }
.stat3 .l { font-size: var(--font-size-sm); color: var(--text-tertiary); }
.grid3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.fld { display: flex; flex-direction: column; gap: 4px; }
.fld .lb { font-size: var(--font-size-sm); color: var(--text-secondary); }
.fld .hint { font-size: var(--font-size-xs); color: var(--text-tertiary); }
.inp { height: 28px; padding: 0 9px; background: var(--bg-input); border: 1px solid var(--border-input);
  border-radius: var(--radius-input); color: var(--text-primary); outline: none; width: 100%;
  font-family: var(--mono); font-size: var(--font-size-base); transition: border-color 0.2s, box-shadow 0.2s; }
.inp:focus { border-color: var(--border-strong); box-shadow: var(--shadow-input-focus); }
select.inp { font-family: var(--font); cursor: pointer; }
input[type=range] { accent-color: var(--color-primary); width: 100%; cursor: pointer; }
.row-sw { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius-button);
  background: var(--bg-card); border: 1px solid var(--border); }
.row-sw .lb { flex: 1; min-width: 0; font-size: var(--font-size-base); }
.row-sw.off { opacity: 0.5; }
/* 开关（原生 checkbox + token 外观） */
.sw { position: relative; width: 30px; height: 17px; flex-shrink: 0; }
.sw input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.sw .track { position: absolute; inset: 0; border-radius: 9px; background: var(--border-strong);
  transition: background-color 0.2s; pointer-events: none; }
.sw .knob { position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%;
  background: var(--bg-card); transition: transform 0.2s; pointer-events: none; }
.sw input:checked ~ .track { background: var(--color-success); }
.sw input:checked ~ .knob { transform: translateX(13px); }
.sw input:focus-visible ~ .track { outline: 2px solid var(--color-info); outline-offset: 1px; }
.sw.risk input:checked ~ .track { background: var(--color-danger); }
/* 监控折线图（颜色读 token，随主题反色） */
.chart { width: 100%; height: 220px; display: block; }
.chart .ax { stroke: var(--border); stroke-width: 1; }
.chart .ln { fill: none; stroke-width: 1.6; }
.chart .gl { font-size: 9px; fill: var(--text-tertiary); font-family: var(--mono); }

/* 设置：色板卡 / 字号档位 */
.pal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; }
.pal-card { display: flex; flex-direction: column; gap: 6px; padding: 8px; border-radius: var(--radius-button);
  border: 1px solid var(--border); background: var(--bg-card); text-align: left;
  transition: border-color 0.15s, box-shadow 0.15s; }
.pal-card:hover { border-color: var(--border-strong); }
.pal-card.on { border-color: var(--color-primary); box-shadow: var(--shadow-input-focus); }
.pal-sw { display: flex; gap: 3px; height: 22px; border-radius: 5px; overflow: hidden; border: 1px solid var(--border); }
.pal-sw i { flex: 1; }
.pal-card .nm { font-size: var(--font-size-sm); color: var(--text-secondary); }
.pal-card.on .nm { color: var(--text-primary); font-weight: 500; }
.size-tags { display: flex; gap: 6px; }
.size-tag { padding: 5px 11px; border-radius: var(--radius-button); border: 1px solid var(--border-strong);
  font-size: var(--font-size-sm); color: var(--text-secondary); transition: background-color 0.15s, color 0.15s; }
.size-tag:hover { background: var(--bg-hover); color: var(--text-primary); }
.size-tag.on { background: var(--color-primary); color: var(--color-primary-contrast); border-color: var(--color-primary); }

/* 应用配置：布尔走行内开关，其余「标签上 / 控件下」 */
.cfg-row { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: var(--radius-button); }
.cfg-row + .cfg-row { border-top: 1px solid var(--border); }
.cfg-row .lb { flex: 1; min-width: 0; font-size: var(--font-size-base); }
.cfg-col { display: flex; flex-direction: column; gap: 4px; padding: 9px 10px; }
.cfg-col + .cfg-col { border-top: 1px solid var(--border); }
.cfg-col .lb { font-size: var(--font-size-sm); color: var(--text-secondary); }

/* ==================== 命令面板 ==================== */
.ovl { position: fixed; inset: 0; z-index: 50; display: flex; }
.ovl.center-y { align-items: center; justify-content: center; background: color-mix(in srgb, black 45%, transparent); }
.palette { width: min(440px, 92vw); max-height: 60vh; display: flex; flex-direction: column; align-self: flex-start;
  margin-top: 18vh; background: var(--bg-card); border: 1px solid var(--border-strong);
  border-radius: var(--radius-card); box-shadow: var(--shadow-card-hover); overflow: hidden; }
.palette .srch { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
.palette .srch input { flex: 1; min-width: 0; border: none; outline: none; background: none;
  color: var(--text-primary); font-size: var(--font-size-lg); }
.palette .lst { flex: 1; min-height: 0; overflow-y: auto; padding: 6px; }
.palette .it { display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: var(--radius-button);
  width: 100%; text-align: left; font-size: var(--font-size-base); color: var(--text-secondary);
  transition: background-color 0.12s, color 0.12s; }
.palette .it:hover, .palette .it.cur { background: var(--color-primary-light); color: var(--text-primary); }
.palette .grp { font-size: var(--font-size-xs); color: var(--text-tertiary); padding: 7px 9px 3px; letter-spacing: 0.08em; }
.palette .empty { padding: 18px; text-align: center; color: var(--text-tertiary); font-size: var(--font-size-base); }

/* ==================== 全局弹窗层 ==================== */
.dlg { width: min(480px, 92vw); max-height: 82vh; display: flex; flex-direction: column;
  background: var(--bg-card); border: 1px solid var(--border-strong); border-radius: var(--radius-card);
  box-shadow: var(--shadow-card-hover); overflow: hidden; }
.dlg.wide { width: min(620px, 94vw); }
.dlg-h { padding: 13px 16px 10px; display: flex; align-items: center; gap: 10px; flex-shrink: 0;
  border-bottom: 1px solid var(--border); }
.dlg-h .t { font-size: var(--font-size-lg); font-weight: 600; flex: 1; min-width: 0; }
.dlg-b { padding: 14px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.dlg-f { padding: 10px 16px 13px; display: flex; justify-content: flex-end; gap: 8px; flex-shrink: 0;
  border-top: 1px solid var(--border); }
.dlg-path { font-family: var(--mono); font-size: var(--font-size-sm); padding: 7px 9px; border-radius: 6px;
  background: var(--bg-sidebar); border: 1px solid var(--border); overflow-wrap: anywhere; }
/* 弹窗里的破坏性确认：实心，让「取消 / 确认」的主次一眼分明 */
.btn.danger-fill { background: var(--color-danger); color: var(--color-primary-contrast); }
.btn.danger-fill:hover { filter: brightness(0.92); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.chk { display: flex; align-items: center; gap: 7px; font-size: var(--font-size-base); color: var(--text-secondary); cursor: pointer; }
.chk input { accent-color: var(--color-primary); width: 14px; height: 14px; cursor: pointer; }
.risk-list { display: flex; flex-direction: column; gap: 6px; }
.risk-it { display: flex; align-items: flex-start; gap: 8px; padding: 8px 9px; border-radius: var(--radius-button);
  background: var(--color-danger-light); border: 1px solid color-mix(in srgb, var(--color-danger) 30%, transparent); }
.risk-it .tt { font-family: var(--mono); font-size: var(--font-size-sm); color: var(--color-danger); font-weight: 600; }
.risk-it .dd { font-size: var(--font-size-sm); color: var(--text-secondary); }

/* ==================== 启动屏 ==================== */
.boot { position: fixed; inset: 0; z-index: 100; background: var(--bg-page);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
.boot .glyph { width: 46px; height: 46px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
  background: var(--color-primary); color: var(--color-primary-contrast); font-family: var(--mono);
  font-size: var(--font-size-xl); animation: caret 1.05s steps(1) infinite; }
@keyframes caret { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0.35 } }
.boot .line { font-family: var(--mono); font-size: var(--font-size-base); color: var(--text-secondary); }
.boot .log { display: flex; flex-direction: column; gap: 3px; font-family: var(--mono);
  font-size: var(--font-size-sm); color: var(--text-tertiary); min-width: 260px; }
.boot .log div { display: flex; gap: 7px; }
.boot .log .ok { color: var(--color-success); }
.boot .bar { width: 260px; height: 3px; border-radius: 2px; background: var(--border); overflow: hidden; }
.boot .bar i { display: block; height: 100%; background: var(--color-primary); border-radius: 2px; transition: width 0.3s; }

/* 窄屏：检查器默认收起，但**始终保留入口**（标题栏切换按钮），不彻底失去
   实例 / 授权 / 通道 三个视图的操作能力。responsive 必须是结构性的，
   不能靠「藏起来」来消除重叠。 */
.inspector[data-open='0'] { display: none; }
@media (max-width: 860px) { .ws-tools { display: none; } }

/* ==================== 分屏树 ==================== */
const leaf = app => ({ k: 'leaf', app });

/**
 * 分屏节点。`key` 是比例的持久槽位。
 *
 * 为什么 key 必须与写回方共用同一套名字：buildTree 每次重建树都从 state.ratios[key]
 * 取比例，拖拽 / 方向键则按 DOM 上的 data-split 写回同一槽位。两边名字不一致时
 * 拖拽结果会被静默丢弃（表现：拖完比例，切一下 app 就弹回去）。key 带布局预设名前缀，
 * 避免「主从」与「双栏」里同名的内外层槽位互相串值。
 */
const split = (key, dir, defRatio, a, b) => ({
  k: 'split', dir, id: key, ratio: state.ratios[key] ?? defRatio, c: [a, b],
});

function runningIds() {
  const hidden = state.hidden || new Set();
  return APPS.filter(a => (a.state === 'running' || a.state === 'degraded' || a.state === 'approval')
    && !hidden.has(a.id)).map(a => a.id);
}

function buildTree(preset) {
  const list = runningIds();
  if (!list.length) return null;
  const i = list.indexOf(state.active);
  if (i > 0) list.splice(i, 1), list.splice(0, 0, state.active);
  const L = list;
  const pick = n => L.slice(0, n);

  if (state.maximized) return leaf(state.maximized);
  if (preset === 'single' || L.length === 1) return leaf(L[0]);
  if (L.length === 2) return split('two.h', 'h', 0.6, leaf(L[0]), leaf(L[1]));

  if (preset === 'focus') {
    const l = pick(3);
    if (l.length === 3) {
      const a = split('focus.inner', 'v', 0.5, leaf(l[1]), leaf(l[2]));
      return split('focus.outer', 'h', 0.64, leaf(l[0]), a);
    }
  }
  if (preset === 'thirds') {
    const l = pick(3);
    const r = 1 / 3;
    return split('thirds.outer', 'h', r,
      leaf(l[0]),
      split('thirds.inner', 'h', r, leaf(l[1]), leaf(l[2])));
  }
  if (preset === 'columns' || preset === 'rows') {
    const l = pick(4);
    const dir = preset === 'columns' ? 'v' : 'h';   // 内层切分方向
    const outer = preset === 'columns' ? 'h' : 'v';
    if (l.length === 3) {
      return split(preset + '.outer', outer, 0.5,
        split(preset + '.left', dir, 0.5, leaf(l[0]), leaf(l[1])), leaf(l[2]));
    }
    return split(preset + '.outer', outer, 0.5,
      split(preset + '.left', dir, 0.5, leaf(l[0]), leaf(l[1])),
      split(preset + '.right', dir, 0.5, leaf(l[2]), leaf(l[3])));
  }
  return leaf(L[0]);
}

function renderLeaf(node) {
  const app = byId[node.app];
  if (!app) return null;
  // 直接产出 split 的直接子元素：.split > .node 才能命中，flex 比例才有意义。
  // 早前这里往 container（已是 .node 的 DIV）里再塞一层 section.node，导致叶子
  // 多出一层没被 `.split > .node` 命中的壳 —— flex 比例落在空壳上，面板按内容
  // 高度浮动，表现为「分屏比例失灵 + 大片空白」。
  const el = document.createElement('div');
  el.className = 'node';
  const focused = app.id === state.active;
  el.innerHTML = `<div class="pane ${focused ? 'focused' : ''}" data-app="${app.id}">
    <div class="pane-head">
      <span class="sdot ${app.state}"></span>
      <span class="nm">${app.name}</span>
      <span class="grow"><span class="meta">${app.version} · ${STATE_TEXT[app.state]}</span></span>
      <span class="chip ${app.state === 'running' ? 'ok' : app.state === 'approval' ? 'warn' : ''}">${app.badge}</span>
      <div class="pane-acts">
        <button class="pact" data-act="focus" data-app="${app.id}" title="设为活动面板" aria-label="设为活动面板">${svg('max', 13)}</button>
        <button class="pact" data-act="pop" data-app="${app.id}" title="剥出为独立窗口（bareWindow 路由）" aria-label="剥出独立窗口">${svg('pop', 13)}</button>
        <button class="pact danger" data-act="close" data-app="${app.id}" title="关闭面板并停用实例" aria-label="关闭面板并停用实例">${svg('x', 13)}</button>
      </div>
    </div>
    <div class="pane-body ${app.kind === 'term' ? 'flush' : ''}">${paneBody(app)}</div>
  </div>`;
  return el;
}

function applyRatio(el, dir, r) {
  const [a, , b] = el.children;
  a.style.flex = `${r} 1 0%`;
  b.style.flex = `${1 - r} 1 0%`;
  // 槽位内部恒为 column（面板头在上 / 内容在下）。分屏方向只决定槽位之间怎么排，
  // 不能顺着传进槽位 —— 否则叶子面板的头与内容会并排。
  a.style.flexDirection = 'column';
  b.style.flexDirection = 'column';
}

function renderNode(node) {
  if (node.k === 'leaf') return renderLeaf(node);

  const el = document.createElement('div');
  el.className = `split dir-${node.dir}`;
  el.dataset.split = node.id;

  const g = document.createElement('div');
  g.className = 'gutter';
  g.tabIndex = 0;
  g.setAttribute('role', 'separator');
  g.setAttribute('aria-orientation', node.dir === 'h' ? 'vertical' : 'horizontal');
  g.setAttribute('aria-label', '拖拽调整分屏比例');

  el.append(renderNode(node.c[0]), g, renderNode(node.c[1]));
  applyRatio(el, node.dir, node.ratio);
  return el;
}

        </div>
      </div></div>

    <div class="blk"><div class="blk-h"><span class="t">高级配置</span><span class="grow"></span>
      <span class="chip">重启时生效</span></div>
      <div class="blk-body">
        <div class="grid3">
          ${NET_FIELDS.map(f => f.type === 'bool'
            ? `<div class="row-sw"><span class="lb">${f.label}</span>
                <span class="sw"><input type="checkbox" ${SERVER.net[f.k] ? 'checked' : ''}
                  data-act="srvNet" data-k="${f.k}" data-v="bool" aria-label="${f.label}"/>

                <input class="inp" type="number" min="${f.min}" max="${f.max}" value="${SERVER.net[f.k]}"
                  data-act="srvNet" data-k="${f.k}" data-v="num" aria-label="${f.label}"/>
                ${f.hint ? `<span class="hint">${f.hint}</span>` : ''}</div>`).join('')}
        </div>
        <div class="row-sw" style="margin-top:8px;background:transparent;border-style:dashed">

            <span class="track"></span><span class="knob"></span></span>

    <div class="blk"><div class="blk-h"><span class="t">性能监控</span></div>
      <div class="blk-body">
        <div class="grid3" style="margin-bottom:10px">
          <div class="fld"><span class="lb">运行时长</span><span class="mono" style="font-size:var(--font-size-lg)">${fmtUp}</span></div>
          <div class="fld"><span class="lb">连接数</span><span class="mono" style="font-size:var(--font-size-lg)">${m.connections}</span></div>
          <div class="fld"><span class="lb">总请求数</span><span class="mono" style="font-size:var(--font-size-lg)">${m.requests.toLocaleString()}</span></div>
          <div class="fld"><span class="lb">CPU 占用</span><span class="mono" style="font-size:var(--font-size-lg)">${m.cpu}%</span></div>
          <div class="fld"><span class="lb">内存占用</span><span class="mono" style="font-size:var(--font-size-lg)">${m.mem} MB</span></div>
          <div class="fld"><span class="lb">请求速率</span><span class="mono" style="font-size:var(--font-size-lg)">${m.rps} req/s</span></div>
        </div>
        <svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img"
          aria-label="WebSocket 收发速率时序图，最近 2 分钟">
          ${grid}
          <polygon points="0,${H} ${pts(SERVER.history.sent)} ${W},${H}"
            fill="color-mix(in srgb, var(--color-primary) 10%, transparent)"/>
          <polygon points="0,${H} ${pts(SERVER.history.recv)} ${W},${H}"
            fill="color-mix(in srgb, var(--color-success) 10%, transparent)"/>
          <polyline class="ln" points="${pts(SERVER.history.sent)}" stroke="var(--color-primary)"/>
          <polyline class="ln" points="${pts(SERVER.history.recv)}" stroke="var(--color-success)"/>
        </svg>
        <div style="display:flex;gap:14px;margin-top:6px">
          <span class="chip">WS 发送速率</span><span class="chip ok">WS 接收速率</span>
          <span style="flex:1"></span><span class="note">2s × 60 点 = 2 分钟窗口 · 单位 msg/s</span>
        </div>
      </div></div>
  </div>`;
}

/* ==================== 管理中心容器 ====================
   三个二级页对应现有三条独立路由的合并：
     应用   ← /plugins + /plugins/:id + /plugins/:id/config + /settings/authorization
     服务器 ← /server（现状无导航入口，此处收进管理中心）
     设置   ← /settings + /settings/authorization 的策略控件
   合并理由：四页同属「管理」语义，分屏布局下不该占用多个面板。 */
function renderManagement() {
  const tabs = [
    ['apps', 'shield', '应用'],
    ['server', 'server', '服务器'],
    ['settings', 'gear', '设置'],
  ];
  document.getElementById('sbLayout').textContent = '管理中心 · ' + tabs.find(t => t[0] === state.mgmtTab)[2];
  const wrap = document.createElement('div');
  wrap.className = 'mgmt';
  wrap.innerHTML = `<div class="mgmt-tabs" role="tablist">
      ${tabs.map(([k, ic, t]) => `<button role="tab" class="${state.mgmtTab === k ? 'on' : ''}"
        data-act="mgmtTab" data-v="${k}" aria-selected="${state.mgmtTab === k}">
        ${ICONS[ic](14)}${t}</button>`).join('')}
    </div>
    <div class="mgmt-pane">${
      state.mgmtTab === 'apps'
        ? (state.cfgSel ? renderConfigView() : renderGovernance())
        : state.mgmtTab === 'server' ? renderServerPanel() : renderSettingsPanel()
    }</div>`;
  return wrap;
}

/* ==================== 应用配置面（schema 驱动） ====================
   控件形态与现有 PluginConfigView 一致：
     boolean → 行内开关（布局与其他类型不同）
     string + enum → Select；string → text input
     number + min/max → 自绘滑杆；number 无范围 → number input
   存储走插件私有 kv（plugin_storage_get/set），不是主库。 */
function renderConfigView() {
  const a = byId[state.cfgSel];
  const schema = CONFIG_DEMO[a.id];
  document.getElementById('sbLayout').textContent = '应用配置 · ' + a.name;
  const bar = `<div class="srv-head" style="padding:10px 12px">
      <button class="btn ghost" data-act="cfgBack">${svg('x', 13)} 返回</button>
      <span class="t" style="font-weight:600">${a.full}</span>
      <span class="chip">${a.version}</span>
      <span style="flex:1"></span>
      <button class="btn ghost" data-act="cfgReset">重置</button>
      <button class="btn" data-act="cfgSave">${svg('check', 13)} 保存</button>
    </div>`;
  const notActive = a.state === 'dormant';
  if (!schema || !Object.keys(schema.properties).length) {
    return bar + `<div class="empty" style="flex:1">${svg('gear', 24, 1.5)}
      <div style="font-size:var(--font-size-lg);color:var(--text-secondary)">${a.full} — 无可用的配置项</div>
      <div class="note">manifest 的 <code>contributes.configuration.properties</code> 为空。
        现状四个 manifest 全部如此，配置面接线完整但产出为空。</div></div>`;
  }
  if (notActive) {
    return bar + `<div class="empty" style="flex:1">${svg('warn', 24, 1.5)}
      <div style="font-size:var(--font-size-lg);color:var(--text-secondary)">应用未激活，无法访问配置</div></div>`;
  }
  const rows = Object.entries(schema.properties).map(([k, f]) => {
    if (f.type === 'boolean') {
      return `<div class="cfg-row"><span class="lb">${f.title}</span>
        <span class="sw"><input type="checkbox" ${f.default ? 'checked' : ''} data-act="cfgBool"
          data-k="${k}" aria-label="${f.title}"/><span class="track"></span><span class="knob"></span></span></div>`;
    }
    let ctrl;
    if (f.enum) {
      ctrl = `<select class="inp" style="max-width:280px" data-act="cfgSet" data-k="${k}" aria-label="${f.title}">
        ${f.enum.map(o => `<option ${o === f.default ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
    } else if (f.type === 'number' && f.minimum != null) {
      const span = f.maximum - f.minimum;
      const step = span >= 5 ? 1 : 0.1;
      ctrl = `<input type="range" min="${f.minimum}" max="${f.maximum}" step="${step}" value="${f.default}"
        data-act="cfgNum" data-k="${k}" aria-label="${f.title}"/>
        <span class="mono" style="font-size:var(--font-size-sm);color:var(--text-tertiary)">${f.default}</span>`;
    } else if (f.type === 'number') {
      ctrl = `<input class="inp" type="number" value="${f.default}" data-act="cfgNum" data-k="${k}"
        style="max-width:200px" aria-label="${f.title}"/>`;
    } else {
      ctrl = `<input class="inp" style="max-width:340px" value="${f.default}" data-act="cfgSet"
        data-k="${k}" aria-label="${f.title}"/>`;
    }
    return `<div class="cfg-col"><span class="lb">${f.title}</span>${ctrl}</div>`;
  }).join('');
  return bar + `<div class="pane-scroll"><div class="blk"><div class="blk-h"><span class="t">Config</span></div>
    <div class="blk-body" style="padding:4px 10px">${rows}</div></div>
    <div class="blk"><div class="blk-h"><span class="t">Info</span></div>
      <div class="blk-body">
        <div class="kv"><b>ID</b><span>${a.pid}</span></div>
        <div class="kv"><b>扩展路径</b><span>~/.bedcode/plugins/${a.id}</span></div>
        <button class="mini" data-act="copyPath">${svg('file', 12)} 复制路径</button>
      </div></div>
    <div class="note">存储走插件私有 kv（<code>plugin_storage_get/set</code>），不进宿主主库。
      保存需实例在运行态。</div></div>`;
}

/* ==================== 命令面板（Ctrl+Shift+P） ====================
   现有实现无任何可见按钮、全靠快捷键唤起，是最容易在改版里丢掉的入口。
   数据源 = 各 manifest contributes.commands 汇总 + 宿主动作。 */
function allCommands() {
  const out = [...HOST_COMMANDS];
  for (const a of APPS) {
    for (const id of (PLUGIN_COMMAND_TITLES[a.id] || [])) {
      out.push({ id: `${a.id}.${id}`, title: id, src: a.name });
    }
  }
  return out;
}
function renderPalette() {
  const q = (state.paletteQ || '').toLowerCase();
  const list = allCommands().filter(c => !q || c.title.toLowerCase().includes(q) || c.id.toLowerCase().includes(q));
  const el = document.createElement('div');
  el.className = 'ovl center-y';
  el.innerHTML = `<div class="palette" role="dialog" aria-label="命令面板">
    <div class="srch">${svg('search', 15)}
      <input placeholder="搜索应用命令…" value="${state.paletteQ || ''}" data-act="paletteInput"
        aria-label="搜索命令"/><kbd style="font-family:var(--mono);font-size:var(--font-size-xs);color:var(--text-tertiary)">Esc</kbd></div>
    <div class="lst">
      ${list.length ? list.map(c => `<button class="it ${c.id === state.paletteCur ? 'cur' : ''}"
        data-act="runCmd" data-id="${c.id}">${svg('run', 13)}<span style="flex:1;min-width:0;text-align:left">${c.title}</span>
        <span class="chip">${c.src}</span></button>`).join('')
        : '<div class="empty">没有找到匹配的命令</div>'}
    </div></div>`;
  return el;
}

/* ==================== 全局弹窗层 ====================
   现有宿主承载 6 类弹窗/遮罩，其中两类授权弹窗用 z-[9999] 强制浮在启停
   LoadingOverlay(z-50) 之上（有回归锁）—— 本方案保留同一层级约定。 */
function dlgShell(title, body, foot, wide) {
  const el = document.createElement('div');
  el.className = 'ovl center-y';
  el.innerHTML = `<div class="dlg ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${title}">
    <div class="dlg-h">${svg('shield', 16)}<span class="t">${title}</span>
      <button class="pact" data-act="closeDlg" aria-label="关闭">${svg('x', 14)}</button></div>
    <div class="dlg-b">${body}</div>
    <div class="dlg-f">${foot}</div></div>`;
  return el;
}

function renderDialog() {
  const d = state.dialog;
  const f = (act, label, cls) => `<button class="btn ${cls || 'ghost'}" data-act="${act}">${label}</button>`;
  if (d === 'fs') {
    return dlgShell('文件系统授权', `
      <div class="note">应用 <b>Agent Hub</b> 请求读写文件。</div>
      <div class="dlg-path">~/.claude/skills</div>
      <div class="row-sw"><span class="lb">操作集</span><span class="chip">读写</span>
        <span class="chip info">勾选记住将按所在目录授权</span></div>
      <div class="note warn">「记住」只在「按需询问」档出现；「总是询问」档下按钮变成「允许本次」。</div>`,
      f('dlgNo', '拒绝') + f('dlgDeny', '以后都拒绝')
      + `<label class="chk"><input type="checkbox" checked/> 记住此选择</label>`
      + f('dlgYes', '允许', ''));
  }
  if (d === 'fs-picker') {
    return dlgShell('文件系统授权', `
      <div class="note">你刚在系统选择框中选中以下路径：</div>

/* ---- 宿主自有面 2：应用治理（启停 · 卸载 · 单应用授权详情 · 授权策略） ----
   每个交互都对应一条真实宿主命令：
     toggleEnable → plugin_activate / plugin_deactivate（启用方向先 plugin_preauthorize）
     approve      → plugin_approve（返回实际授予的权限位清单）
     uninstall    → plugin_uninstall（所有来源均可卸载）
     setStrategy  → plugin_auth_set_strategy(pluginId, resource, strategy)
     revoke       → plugin_auth_revoke
     install      → plugin_install_from_file
   列表排序按授权风险（always_allow 最宽松 = 风险最高，置顶），对齐 sortAppsByRisk。 */
function renderGovernance() {
  document.getElementById('sbLayout').textContent = '应用治理';
  const sorted = [...APPS].sort((x, y) => appRiskRank(x) - appRiskRank(y) || x.name.localeCompare(y.name));
  const sel = byId[state.govSel] || sorted[0];

  const row = a => {
    const on = a.state === 'running' || a.state === 'degraded' || a.state === 'approval';
    return `<button class="gov-row ${a.id === sel.id ? 'on' : ''}" data-act="govSel" data-app="${a.id}"
        aria-pressed="${a.id === sel.id}">
      <span class="sdot ${a.state}"></span>
      <span class="nm"><b>${a.full}</b>
        <span>v${a.version} · ${APP_SOURCE_LABEL[a.source] || a.source} · ${a.size}</span></span>
      <span class="sw" role="switch" aria-checked="${on}" aria-label="${a.name} 运行开关">
        <span class="track"></span><span class="knob" style="${on ? 'transform:translateX(13px)' : ''}"></span>
      </span>
    </button>`;
  };

  const recRow = r => {
    const idx = sel.records.indexOf(r);
    const auto = r.source === 'always_allow' && r.effect === 'allow';
    return `<div class="rec ${r.effect === 'deny' ? 'deny' : ''} ${auto ? 'unconfirmed' : ''}">
      <span class="chip">${RESOURCE_LABEL[r.resource]}</span>
      <span class="tg" title="${r.target}">${r.target}</span>
      <span class="chip">${opsLabel(r.ops)}</span>
      ${r.prefixMatch && r.effect === 'allow' ? '<span class="chip info" title="前缀匹配：子路径一并放行">前缀</span>' : ''}
      ${auto ? '<span class="chip warn" title="策略层自动放行，用户未逐条确认">未经确认</span>' : ''}
      <button class="mini danger" data-act="revoke" data-app="${sel.id}" data-idx="${idx}"
        title="撤销该授权记录">撤销</button>
    </div>`;
  };

  const groups = [
    { t: '用户已授权', kind: 'user', list: userGranted(sel),
      note: '用户在授权弹窗逐条确认的记录（含旧版遗留回退）。撤销后下次访问该目标会重新询问。' },
    { t: '免询问自动放行', kind: 'auto', list: autoAllowed(sel),
      note: '策略档位为「始终允许」时由授权层自动放行并落账，用户未逐条确认过——故标「未经确认」。' },
    { t: '内置免询问', kind: 'fp', list: sel.firstPartyDirs,
      note: '第一方免询问清单的只读投影（宿主数据真源，不落在授权记录表里，故无撤销入口）。' },
    { t: '硬拒绝', kind: 'deny', list: denied(sel),
      note: '用户明确拒绝过的目标；命中即拒，不回退到询问。' },
  ];

  return `
  <div class="gov">
      <div class="gov-list">
        <div class="gov-list-head"><span class="t">已安装应用</span>
          <span class="chip">${APPS.length}</span>
          <button class="mini" data-act="install">${svg('plus', 12)} 安装</button>
        </div>
        <div class="gov-scroll">${sorted.map(row).join('')}</div>
        <div class="gov-list-head" style="border-bottom:none;border-top:1px solid var(--border);flex-direction:column;align-items:flex-start;gap:4px">
          <div class="note">列表按授权风险排序：「始终允许」的应用置顶。</div>
        </div>
      </div>

      <div class="gov-detail">
        <div class="gov-detail-head">${svg(sel.icon, 18)}
          <span class="nm">${sel.full}</span>
          <span class="chip ${sel.state === 'running' ? 'ok' : sel.state === 'approval' ? 'warn' : ''}">${STATE_TEXT[sel.state]}</span>
          <span style="flex:1"></span>
          ${sel.state === 'approval'
            ? `<button class="btn" data-act="approve" data-app="${sel.id}">${svg('check', 13)} 批准并启动</button>`
            : `<button class="btn ghost" data-act="toggleEnable" data-app="${sel.id}">${sel.state === 'dormant' ? svg('play', 13) + ' 启用' : svg('stop', 13) + ' 停用'}</button>`}
          <button class="btn ghost" data-act="cfgOpen" data-app="${sel.id}">${svg('gear', 13)} 配置</button>
          <button class="btn ghost danger-outline" data-act="uninstall" data-app="${sel.id}" ${sel.state !== 'dormant' ? 'disabled title="请先停用应用后再卸载"' : ''}>${svg('trash', 13)} 卸载</button>
        </div>

        <div class="gov-scroll-y">
          <div class="blk"><div class="blk-h"><span class="t">应用信息</span></div>
            <div class="blk-body">
              <div class="kv"><b>应用 ID</b><span>${sel.id}</span></div>
              <div class="kv"><b>插件 ID</b><span>${sel.pid}</span></div>
              <div class="kv"><b>版本 / 来源</b><span>${sel.version} · ${APP_SOURCE_LABEL[sel.source] || sel.source}</span></div>
              <div class="kv"><b>占用空间</b><span>${sel.size}</span></div>
              <div class="kv"><b>扩展点</b><span>${sel.views} 视图 / ${sel.commands} 命令</span></div>
            </div>
          </div>

          <div class="blk"><div class="blk-h"><span class="t">授权策略</span><span class="grow"></span>
            <span class="chip info">plugin_auth_set_strategy</span></div>
            <div class="blk-body">
              ${Object.entries(sel.strategies).map(([res, s]) => `
                <div class="strat-row"><span class="lb">${RESOURCE_LABEL[res]}</span>
                  <div class="seg" role="group" aria-label="${RESOURCE_LABEL[res]} 授权策略">
                    ${STRATEGIES.map(t => `<button class="${t === s ? 'on' : ''} ${t === s && t === 'always_allow' ? 'risky' : ''}"
                      data-act="setStrategy" data-app="${sel.id}" data-res="${res}" data-strategy="${t}"
                      aria-pressed="${t === s}">${STRATEGY_LABEL[t]}</button>`).join('')}
                  </div>
                </div>`).join('')}
              <div class="note">策略决定「问不问 / 放不放」，真源在宿主授权策略层；前端只提交档位，不自行判定放行。
                档位变化<b>不追溯</b>已落账记录——要收紧得按记录逐条撤销。</div>
            </div>
          </div>

          ${groups.map(g => `
            <div class="blk"><div class="blk-h"><span class="t">${g.t}</span>
              <span class="chip ${g.kind === 'deny' && g.list.length ? 'danger' : g.kind === 'auto' && g.list.length ? 'warn' : ''}">${g.list.length}</span>
              <span class="grow"></span></div>
              <div class="blk-body">
                ${g.list.length
                  ? (g.kind === 'fp'
                      ? g.list.map(e => `<div class="rec"><span class="chip">目录</span><span class="tg">${fpLabel(e)}</span>
                          <span class="chip">${e.kind === 'home' ? '家目录前缀' : '项目目录段'}</span></div>`).join('')
                      : g.list.map(recRow).join(''))
                  : `<div class="note">暂无</div>`}
                <div class="note" style="margin-top:7px">${g.note}</div>
              </div>
            </div>`).join('')}

          <div class="blk"><div class="blk-h"><span class="t">manifest 声明的权限位</span><span class="grow"></span>
            <span class="chip">${sel.granted.length} 位</span></div>
            <div class="blk-body">
              <div class="ov-perm">${sel.granted.map(p => `<span class="pill ${isRisk(p) ? 'risk' : ''}">${p}</span>`).join('')}</div>
              ${sel.granted.filter(isRisk).length ? `<div class="note danger" style="margin-top:7px">
                含 ${sel.granted.filter(isRisk).length} 个高危位：授予即等于在本机执行任意命令 / 向终端注入输入 / 读写主库。
                这类权限在<b>加载期</b>由 manifest 校验与审批门整单裁决，运行期<b>没有逐位开关</b>。</div>` : ''}
            </div>
          </div>
        </div>
      </div>
  </div>`;
}

/* ==================== 左轨 ==================== */
function renderRail() {
  const box = document.getElementById('railApps');
  box.innerHTML = '';
  for (const a of APPS) {
    const b = document.createElement('button');
    // pluginType === 'rust' 的应用「始终启用」：不提供开关（沿用现有约定）
    const always = a.pluginType === 'rust';
    b.className = 'ic-btn' + (a.state === 'dormant' ? ' dormant' : '');
    b.title = `${a.full} · ${STATE_TEXT[a.state]}${always ? ' · 始终启用' : ''}`;
    b.setAttribute('aria-label', b.title);
    b.dataset.act = always ? 'noop' : 'toggleApp';
    b.dataset.app = a.id;
    if (state.mode === 'workspace' && state.active === a.id && a.state !== 'dormant') b.classList.add('on');
    const badge = a.state === 'approval' ? '<span class="badge-n">!</span>' : '';
    const dot = always ? '' : `<span class="dot ${a.state}"></span>`;
    b.innerHTML = `<span class="ic">${svg(a.icon, 17)}${dot}${badge}</span><span class="rl">${a.name}</span>`;
    box.appendChild(b);
  }
  const modes = { navWorkspace: 'workspace', navOverview: 'overview', navManagement: 'management' };
  for (const [id, m] of Object.entries(modes)) {
    document.getElementById(id).classList.toggle('on', state.mode === m);
  }
  // 服务状态灯：5s 轮询 get_server_status，折叠态时随导航一并隐藏
  const dot = document.getElementById('lampDot');
  dot.className = 'sdot ' + (SERVER.status === 'running' ? 'running' : SERVER.status === 'starting' ? 'degraded' : 'dormant');
  document.getElementById('lampTxt').textContent =
    SERVER.status === 'running' ? '服务运行中' : SERVER.status === 'starting' ? '服务启动中' : '服务已停止';
  // 导航宽度 / 折叠态
  const rail = document.getElementById('rail');
  rail.dataset.collapsed = state.railCollapsed ? '1' : '0';
  document.documentElement.style.setProperty('--rail-w', (state.railCollapsed ? 56 : state.railW) + 'px');
}

/* ==================== 检查器 ==================== */
function renderInspector() {
  const insp = document.querySelector('.inspector');
  insp.dataset.open = state.inspectorOpen ? '1' : '0';
  const tb = document.getElementById('btnInspector');
  tb.setAttribute('aria-pressed', String(state.inspectorOpen));
  document.querySelectorAll('.insp-tab').forEach(t => {
    const on = t.dataset.itab === state.inspTab;
    t.classList.toggle('on', on);
    t.setAttribute('aria-selected', String(on));
  });
  const body = document.getElementById('inspBody');
  const a = byId[state.active];
  body.innerHTML = state.inspTab === 'instance' ? inspInstance(a)
    : state.inspTab === 'auth' ? inspAuth(a) : inspChan(a);
}

      <button class="btn wide ghost" data-act="pop" data-app="${a.id}">${svg('pop', 13)} 剥出独立窗口</button>
      <button class="btn wide ghost" data-act="governance" data-app="${a.id}">${svg('shield', 13)} 授权与治理</button>
    </div>
    ${risk.length ? `<div class="callout danger">${svg('warn', 13)}
        <span>持有 ${risk.length} 个高危权限位：${risk.join(' · ')}</span></div>` : ''}`;
}

/**
 * 检查器 › 授权 —— 当前活动应用的授权切面
 *
 * 只展示真实存在的三样东西，与 src/utils/authPolicy.ts 的读模型同构：
 *   ① 两类资源的策略档位（可提交，走 plugin_auth_set_strategy）
 *   ② 四分区授权记录（可撤销，走 plugin_auth_revoke）
 *   ③ 内置免询问项（只读投影，无撤销入口）
 * manifest 权限位是**加载期**裁决的声明，运行期不提供逐位开关——故这里只读展示。
 */
function inspAuth(a) {
  const granted = userGranted(a), auto = autoAllowed(a), deny = denied(a);
  const rec = r => {
    const autoRec = r.source === 'always_allow' && r.effect === 'allow';
    return `<div class="rec ${r.effect === 'deny' ? 'deny' : ''} ${autoRec ? 'unconfirmed' : ''}">
      <span class="tg" title="${r.target}">${r.target}</span>
      <span class="chip">${opsLabel(r.ops)}</span>
      ${autoRec ? '<span class="chip warn">未经确认</span>' : ''}
      <button class="mini danger" data-act="revoke" data-app="${a.id}" data-idx="${a.records.indexOf(r)}">撤销</button>
    </div>`;
  };
  const sec = (t, n, inner, note, tone) => `<div class="blk">
      <div class="blk-h"><span class="t">${t}</span><span class="chip ${tone || ''}">${n}</span></div>
      <div class="blk-body">${inner || '<div class="note">暂无</div>'}
        ${note ? `<div class="note" style="margin-top:7px">${note}</div>` : ''}</div></div>`;

  return `
    <div class="blk"><div class="blk-h"><span class="t">授权策略</span></div>
      <div class="blk-body">
        ${Object.entries(a.strategies).map(([res, s]) => `
          <div class="strat-row"><span class="lb">${RESOURCE_LABEL[res]}</span>
            <div class="seg" role="group" aria-label="${RESOURCE_LABEL[res]} 授权策略">
              ${STRATEGIES.map(t => `<button class="${t === s ? 'on' : ''} ${t === s && t === 'always_allow' ? 'risky' : ''}"
                data-act="setStrategy" data-app="${a.id}" data-res="${res}" data-strategy="${t}"
                aria-pressed="${t === s}">${STRATEGY_LABEL[t]}</button>`).join('')}
            </div></div>`).join('')}
      </div></div>

    ${sec('用户已授权', granted.length, granted.map(rec).join(''), '逐条确认过；撤销后下次访问重新询问。')}
    ${sec('免询问自动放行', auto.length, auto.map(rec).join(''),
      '策略「始终允许」自动落账，用户未逐条确认。', auto.length ? 'warn' : '')}
    ${sec('内置免询问', a.firstPartyDirs.length,
      a.firstPartyDirs.map(e => `<div class="rec"><span class="tg">${fpLabel(e)}</span>
        <span class="chip">${e.kind === 'home' ? '家目录前缀' : '项目目录段'}</span></div>`).join(''),
      '第一方清单只读投影，无撤销入口。')}
    ${sec('硬拒绝', deny.length, deny.map(rec).join(''), '命中即拒，不回退询问。', deny.length ? 'danger' : '')}

    <div class="blk"><div class="blk-h"><span class="t">manifest 权限位</span></div>
      <div class="blk-body">
        <div class="ov-perm">${a.granted.filter(isRisk).map(p => `<span class="pill risk">${p}</span>`).join('')}
          ${a.granted.filter(p => !isRisk(p)).slice(0, 8).map(p => `<span class="pill">${p}</span>`).join('')}
          ${a.granted.length > 8 ? `<span class="pill">+${a.granted.length - 8 - a.granted.filter(isRisk).length}</span>` : ''}</div>
        ${a.granted.filter(isRisk).length ? `<div class="note danger" style="margin-top:7px">
          ${a.granted.filter(isRisk).length} 个高危位在<b>加载期</b>整单裁决，运行期无逐位开关。</div>` : ''}
      </div></div>

    <button class="btn wide ghost" data-act="governance" data-app="${a.id}">${svg('hub', 13)} 在应用治理中查看全部</button>`;
}

function inspChan(a) {
  const others = APPS.filter(x => x.id !== a.id && x.state !== 'dormant');
  return `
    <div><div class="sec-t">下行通道 · host-* 原语</div>
      <div class="note">${a.granted.length} 个权限位 → 对应 WIT 原语由宿主闸门逐次裁决，插件拿不到越权能力。</div></div>
    <div class="rule"></div>

        <div class="chan"><div class="top"><span class="t">事件</span><span class="chip">runtime-listeners</span></div>

/* ==================== 状态栏 ==================== */
function renderStatus() {
  const run = APPS.filter(a => a.state === 'running' || a.state === 'degraded').length;
  const pend = APPS.filter(a => a.state === 'approval').length;
  const dorm = APPS.filter(a => a.state === 'dormant').length;
  document.getElementById('sbApps').textContent =
    `${run} 个应用运行中${dorm ? ` · ${dorm} 个未启动` : ''}`;
  document.getElementById('sbApproval').innerHTML = pend
    ? `<span class="sdot approval"></span>${pend} 个待审批`
    : '';
  // 真实指标源：get_server_metrics（连接数 / 请求速率），非虚构值
  document.getElementById('sbConn').textContent = String(SERVER.metrics.connections);
  document.getElementById('sbReq').textContent = String(SERVER.metrics.rps);
}

const PRESET_NAME = { single: '单窗', focus: '主从', thirds: '三栏', columns: '双栏网格', rows: '横排网格' };

function renderAll() {
  renderRail(); renderStage(); renderInspector(); renderStatus(); renderOverlays();
  // 标题栏「当前位置」指示：让用户始终知道自己在哪（评审批注不进产品栏）
  const ctx = { workspace: '工作区', overview: '应用总览', management: '管理中心' }[state.mode];
  document.getElementById('brandCtx').textContent =
    state.mode === 'management' && state.mgmtTab !== 'apps'
      ? `管理中心 · ${{ server: '服务器', settings: '设置' }[state.mgmtTab]}`
      : (state.cfgSel ? '应用配置' : ctx);
}

/** 覆盖层：启动屏 → 命令面板 → 全局弹窗（后者 z 最高，压住前者） */
function renderOverlays() {
  const box = document.getElementById('overlays');
  box.innerHTML = '';
  if (state.boot) box.appendChild(renderBoot());
  if (state.paletteOpen) box.appendChild(renderPalette());
  const d = renderDialog();
  if (d) box.appendChild(d);
}

/* ==================== 交互 ==================== */
function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `${svg('check', 14)}<span>${msg}</span>`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

function openApp(id) {
  const a = byId[id];
  state.active = id;
  if (a.state === 'dormant') { a.state = 'running'; toast(`${a.full} 已启动（演示态）`); }
  state.mode = 'workspace';
  // 最大化的是别的 app 时必须先退出最大化：否则树仍是单叶 A，而 active 已指向 B，
  // 面板与检查器/状态栏展示的实例会各说各话（状态失同步）。
  if (state.maximized && state.maximized !== id) state.maximized = null;
  renderAll();
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-preset],[data-itab],[data-app]');
  if (!t) return;

  if (t.dataset.preset) { state.preset = t.dataset.preset; state.maximized = null; return renderAll(); }
  if (t.dataset.itab) { state.inspTab = t.dataset.itab; return renderInspector(); }

  const act = t.dataset.act, id = t.dataset.app;
  if (act === 'noop') return;
  switch (act) {
    case 'toggleApp': {
      const a = byId[id];
      if (state.hidden && state.hidden.has(id)) { state.hidden.delete(id); return openApp(id); }
      if (a.state === 'dormant') return openApp(id);
      if (state.active === id && state.mode === 'workspace' && state.maximized === id) {
        state.maximized = null; renderAll(); return;
      }
      return openApp(id);
    }
    case 'open': return openApp(id);
    case 'focus': state.active = id; state.maximized = id; return renderAll();
    case 'pop': toast(`${byId[id].full} → 剥出为独立窗口（/plugin/window/:id/:viewId）`); return;
    case 'close': {                      // 关面板：回收工作区槽位，实例继续运行
      const a = byId[id];
      state.hidden = state.hidden || new Set();
      state.hidden.add(id);
      if (state.active === id) state.active = runningIds().find(x => x !== id) || id;
      if (state.maximized === id) state.maximized = null;
      toast(`${a.full} 面板已关闭（实例仍在运行）`);
      return renderAll();
    }
    case 'stop': {                       // 停用实例：回收运行资源
      const a = byId[id];
      a.state = 'dormant'; a.cpu = 0; a.mem = 0;
      state.hidden && state.hidden.delete(id);
      if (state.active === id) state.active = (runningIds()[0] || id);
      if (state.maximized === id) state.maximized = null;
      toast(`${a.full} 实例已停用`);
      return renderAll();
    }
    case 'start': return openApp(id);
    case 'approve': {
      const a = byId[id];
      if (!a || a.state !== 'approval') return;
      a.state = 'running'; a.cpu = 3; a.mem = 38;
      toast(`${a.full} 已批准并启动（整单批准，高危位一并生效）`);
      return renderAll();
    }
    case 'governance': case 'mgmtApps':
      state.mode = 'management'; state.mgmtTab = 'apps'; state.cfgSel = null;
      if (id) state.govSel = id;
      return renderAll();
    case 'mgmtTab': state.mode = 'management'; state.mgmtTab = t.dataset.v; state.cfgSel = null; return renderAll();

    /* ---- 应用治理：生命周期 ---- */
    case 'govSel': state.govSel = id; state.active = id; return renderAll();
    case 'cfgOpen': state.cfgSel = id; state.mgmtTab = 'apps'; return renderAll();
    case 'cfgBack': state.cfgSel = null; return renderAll();
    case 'cfgReset': toast('配置已重置为默认值（未保存）'); return;
    case 'cfgSave': toast(`${byId[state.cfgSel].full} 配置已保存`); return renderAll();
    case 'copyPath': toast('扩展路径已复制到剪贴板'); return;
    case 'toggleEnable': {
      const a = byId[id];
      if (a.pluginType === 'rust') { toast(`${a.full} 为 rust 类型，始终启用`); return; }
      if (a.state === 'dormant') {
        // 启用方向：先 plugin_preauthorize（授权弹窗先行，通过后才 plugin_activate）
        a.state = 'running'; a.cpu = 3; a.mem = 38;
        toast(`${a.full} 已启用（授权预检通过 → 实例激活）`);
      } else {
        a.state = 'dormant'; a.cpu = 0; a.mem = 0;
        toast(`${a.full} 已停用，实例资源已回收`);
      }
      if (state.active === id) state.active = runningIds()[0] || id;
      if (state.maximized === id) state.maximized = null;
      return renderAll();
    }
    case 'uninstall': {
      const a = byId[id];
      // 运行中（含 degraded）不可卸载：按钮禁用而非事后提示
      if (a.state !== 'dormant') { toast('请先停用应用后再卸载'); return; }
      state.dlgApp = id; state.dialog = 'uninstall'; return renderOverlays();
    }
    case 'install': state.dialog = 'install'; return renderOverlays();

    /* ---- 应用治理：授权策略与记录 ---- */
    case 'setStrategy': {
      const a = byId[id];
      const want = t.dataset.strategy;
      // 最高风险档必须二次确认（沿用 AuthorizationView 的 Modal 语义）
      if (want === 'always_allow') {
        state.dlgApp = id; state.dlgRes = t.dataset.res; state.dialog = 'allow-confirm';
        return renderOverlays();
      }
      const before = a.strategies[t.dataset.res];
      a.strategies[t.dataset.res] = want;
      const kept = a.records.filter(r => r.resource === t.dataset.res).length;
      toast(`${RESOURCE_LABEL[t.dataset.res]} 策略 ${STRATEGY_LABEL[before]} → ${STRATEGY_LABEL[want]}`
        + (kept ? `（已有 ${kept} 条记录不受影响，需逐条撤销）` : ''));
      return renderAll();
    }
    case 'revoke': {
      const a = byId[id];
      const i = Number(t.dataset.idx);
      const r = a.records[i];
      if (!r) return;
      a.records.splice(i, 1);
      toast(`已取消授权 ${r.target}`);
      return renderAll();
    }

    /* ---- 服务器面 ---- */
    case 'srvStart': SERVER.status = 'running'; SERVER.uptimeSec = 0;
      toast('服务器已启动'); return renderAll();
    case 'srvStop': SERVER.status = 'stopped'; SERVER.metrics.connections = 0;
      toast('服务器已停止'); return renderAll();
    case 'srvRestart':
      SERVER.status = 'starting';
      toast('服务器重启中…（高级配置的脏字段会先自动提交）');
      SERVER.status = 'running'; SERVER.port = SERVER.portSaved; SERVER.portDirty = false;
      return renderAll();
    case 'srvRestore': toast('高级配置已还原默认（重启后生效）'); return;
    case 'srvSavePort': SERVER.portSaved = SERVER.port; SERVER.portDirty = false;
      state.dialog = 'port-restart'; return renderOverlays();
    case 'srvAutoStart': SERVER.autoStart = !SERVER.autoStart;
      toast(`自启动已${SERVER.autoStart ? '开启' : '关闭'}`); return renderAll();

    /* ---- 设置面 ---- */
    case 'setTheme': SETTINGS.ui.theme = t.dataset.v;
      document.documentElement.classList.toggle('dark', t.dataset.v === 'dark');
      toast(`主题已切到「${t.textContent.trim()}」（立即落盘，不走防抖）`); return renderAll();
    case 'setPalette': SETTINGS.ui.theme_palette = t.dataset.v;
      toast(`色板已切到「${t.dataset.v}」`); return renderAll();
    case 'setLang': SETTINGS.ui.language = t.dataset.v;
      toast(`语言已切到「${t.textContent.trim()}」（400ms 淡出→换文案→双 rAF→淡入）`); return renderAll();
    case 'setFont': SETTINGS.ui.font_size = Number(t.dataset.v);
      toast(`字体 ${t.dataset.v}px（Linux 再乘 1.15）`); return renderAll();
    case 'setAnim': SETTINGS.ui.animations_enabled = !SETTINGS.ui.animations_enabled;
      toast(`动画已${SETTINGS.ui.animations_enabled ? '开启' : '关闭'}`); return renderAll();
    case 'setSleep': SETTINGS.network.prevent_sleep = !SETTINGS.network.prevent_sleep;
      toast(`防止休眠已${SETTINGS.network.prevent_sleep ? '开启' : '关闭'}`); return renderAll();
    case 'gh': toast('在浏览器中打开 GitHub 仓库（http/https scheme 白名单 fail-closed）'); return;
    case 'checkUpdate': toast('已是最新版本'); return;
    case 'logDir': toast('在系统文件管理器中打开日志目录'); return;
    case 'logSave': toast('日志配置已保存（格式 / 轮转重启后生效）'); return;

    /* ---- 命令面板 ---- */
    case 'runCmd': {
      state.paletteOpen = false; state.paletteQ = '';
      const c = allCommands().find(x => x.id === t.dataset.id);
      toast(`执行 ${c ? c.title : t.dataset.id}`);
      return renderAll();
    }

    /* ---- 弹窗 ---- */
    case 'closeDlg': case 'dlgNo':
      state.dialog = null; state.dlgApp = null; return renderOverlays();
    case 'dlgDemo': state.dialog = t.dataset.v; return renderOverlays();
    case 'dlgYes': {
      const was = state.dialog;
      state.dialog = null;
      if (was === 'uninstall') {
        const a = byId[state.dlgApp];
        const i = APPS.indexOf(a);
        if (i >= 0) APPS.splice(i, 1);
        state.govSel = (APPS[0] || {}).id || null;
        state.dlgApp = null;
        toast(`${a.full} 已卸载`);
        return renderAll();
      }
      if (state.dlgRes) {
        const a = byId[state.dlgApp];
        const res = state.dlgRes;
        a.strategies[res] = 'always_allow';
        const kept = a.records.filter(r => r.resource === res).length;
        state.dlgRes = null; state.dlgApp = null;
        toast(`${RESOURCE_LABEL[res]} 策略 → 始终允许`
          + (kept ? `（已有 ${kept} 条记录不追溯，需逐条撤销）` : '（仅实际访问到的目标才逐步累积）'));
      }
      return renderAll();
    }
    case 'dlgDeny': state.dialog = null; toast('已记录硬拒绝，下次命中直接拒'); return renderAll();
    case 'dlgForce': state.dialog = null; toast('已强制退出（终止所有运行中会话）'); return renderOverlays();
    case 'dlgUninstall': return;   // 统一走 dlgYes 分支
    case 'bootDone': state.boot = false; return renderOverlays();
  }
});

/* ---- 需要 change 事件的控件：range / number / select ---- */
document.addEventListener('change', e => {
  const t = e.target.closest('[data-act]');
  if (!t || t.tagName === 'BUTTON') return;
  const act = t.dataset.act, k = t.dataset.k, id = t.dataset.app;
  switch (act) {
    case 'srvPortInput': SERVER.port = Number(t.value); SERVER.portDirty = SERVER.port !== SERVER.portSaved;
      return renderAll();
    case 'srvNet': SERVER.net[k] = t.dataset.v === 'bool' ? t.checked : Number(t.value); return;
    case 'lc': LINK_CRYPTO[k] = t.checked; return renderAll();
    case 'setDefPort': SETTINGS.network.port = Number(t.value); toast(`默认端口 ${t.value}`); return;
    case 'setFont': SETTINGS.ui.font_size = Number(t.value); return renderAll();
    case 'logLevel': LOG_SETTINGS.file_level = t.textContent.trim(); toast('日志级别已即时生效（不落盘）'); return renderAll();
    case 'logFmt': LOG_SETTINGS.format = t.value; return;
    case 'logMaxFiles': LOG_SETTINGS.max_files = Number(t.value); return;
    case 'logCap': LOG_SETTINGS.capacity_mb = Number(t.value); return;
    case 'cfgBool': case 'cfgNum': case 'cfgSet': return;
  }
});

/* ---- 全局快捷键（现有实现全 App 只注册了 Ctrl+,，命令面板另有 Ctrl+Shift+P） ---- */
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  // Ctrl+Shift+P → 命令面板
  if (e.ctrlKey && e.shiftKey && k === 'p') { e.preventDefault(); state.paletteOpen = true; return renderOverlays(); }
  // Ctrl+, → 设置（唯一注册的全局快捷键）
  if (e.ctrlKey && k === ',') { e.preventDefault(); state.mode = 'management'; state.mgmtTab = 'settings'; state.cfgSel = null; return renderAll(); }
  // Esc 逐层退出：弹窗 → 命令面板
  if (e.key === 'Escape') {
    if (state.dialog) { state.dialog = null; state.dlgApp = null; return renderOverlays(); }
    if (state.paletteOpen) { state.paletteOpen = false; state.paletteQ = ''; return renderOverlays(); }
  }
});

/* 导航宽度拖拽：<120px 自动折叠，展开态夹在 160–360px，松手不回弹 */
(function railResize() {
  const grab = document.getElementById('railGrab');
  let dragging = false;
  grab.addEventListener('mousedown', e => { e.preventDefault(); dragging = true; grab.classList.add('dragging'); });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    const w = e.clientX;
    state.railW = Math.min(360, Math.max(120, w));
    state.railCollapsed = state.railW < 120;
    renderRail();
  });
  window.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false; grab.classList.remove('dragging');
    if (state.railCollapsed) state.railW = 56;
    renderRail();
  });
  grab.addEventListener('keydown', e => {
    if (!['ArrowLeft', 'ArrowRight'].includes(e.key)) return;
    e.preventDefault();
    state.railCollapsed = false;
    state.railW = Math.min(360, Math.max(160, state.railW + (e.key === 'ArrowRight' ? 16 : -16)));
    renderRail();
  });
})();
document.getElementById('btnUnmax').onclick = () => { state.maximized = null; renderAll(); };
document.getElementById('btnTheme').onclick = () => {
  document.documentElement.classList.toggle('dark');
};
document.getElementById('btnBoot').onclick = () => { state.boot = true; renderOverlays(); };
document.getElementById('btnInspector').onclick = () => {
  state.inspectorOpen = !state.inspectorOpen;
  renderInspector();
};
document.getElementById('btnDialogs').onclick = () => { state.dialog = 'palette-demo'; renderOverlays(); };
document.getElementById('btnPalette').onclick = () => { state.paletteOpen = true; renderOverlays(); };
document.getElementById('sbHint').onclick = () => { state.paletteOpen = true; renderOverlays(); };

/* ---- 分屏拖拽：实时改 flex，mouseup 才提交进模型 ---- */
let drag = null;
document.addEventListener('mousedown', e => {
  const g = e.target.closest('.gutter');
  if (!g) return;
  e.preventDefault();
  const splitEl = g.parentElement;
  drag = { g, splitEl, dir: splitEl.classList.contains('dir-h') ? 'h' : 'v' };
  g.classList.add('dragging');
});
document.addEventListener('mousemove', e => {
  if (!drag) return;
  const r = drag.splitEl.getBoundingClientRect();
  const ratio = drag.dir === 'h'
    ? (e.clientX - r.left) / r.width
    : (e.clientY - r.top) / r.height;
  const c = Math.min(0.88, Math.max(0.12, ratio));
  applyRatio(drag.splitEl, drag.dir, c);
  drag.ratio = c;
});
document.addEventListener('mouseup', () => {
  if (!drag) return;
  drag.g.classList.remove('dragging');
  // 提交比例：写回与 buildTree 读取同一个槽位（data-split 即 split() 的 key）
  if (drag.ratio != null) state.ratios[drag.splitEl.dataset.split] = drag.ratio;
  drag = null;
});

/* 键盘可达：gutter 聚焦后方向键调比例（无障碍 + 不依赖鼠标） */
document.addEventListener('keydown', e => {
  const g = e.target.closest?.('.gutter');
  if (!g || !['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) return;
  e.preventDefault();
  const splitEl = g.parentElement;
  const dir = splitEl.classList.contains('dir-h') ? 'h' : 'v';
  const a = splitEl.children[0], b = splitEl.children[2];
  const cur = parseFloat(a.style.flex) / (parseFloat(a.style.flex) + parseFloat(b.style.flex));
  const dec = (dir === 'h' && e.key === 'ArrowLeft') || (dir === 'v' && e.key === 'ArrowUp');
  const next = Math.min(0.88, Math.max(0.12, cur + (dec ? -0.04 : 0.04)));
  applyRatio(splitEl, dir, next);
  g.setAttribute('aria-valuenow', Math.round(next * 100));
  state.ratios[splitEl.dataset.split] = next;
});
renderAll();
</script>
