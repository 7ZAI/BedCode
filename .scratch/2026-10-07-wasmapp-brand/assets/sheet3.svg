<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500">
  <rect width="880" height="500" fill="#050607"/>
  <g font-family="DejaVu Sans" font-size="13" fill="#8B939E">

    <!-- A refined W, 4 separated bars -->
    <g transform="translate(16,16) scale(2)">
      <rect width="100" height="100" rx="22" fill="#0A0B0D"/>
      <g stroke="#F4F6F8" stroke-width="13" stroke-linecap="butt">
        <line x1="23.2" y1="33" x2="36.8" y2="67"/>
        <line x1="39.3" y1="67.1" x2="48.7" y2="46.9"/>
        <line x1="51.3" y1="46.9" x2="60.7" y2="67.1"/>
        <line x1="63.2" y1="67" x2="76.8" y2="33"/>
      </g>
    </g>
    <text x="116" y="122" text-anchor="middle">A refined 4-bar W</text>

    <!-- B + amber core triangle in apex gap -->
    <g transform="translate(216,16) scale(2)">
      <rect width="100" height="100" rx="22" fill="#0A0B0D"/>
      <g stroke="#F4F6F8" stroke-width="13" stroke-linecap="butt">
        <line x1="23.2" y1="33" x2="36.8" y2="67"/>
        <line x1="39.3" y1="67.1" x2="48.7" y2="46.9"/>
        <line x1="51.3" y1="46.9" x2="60.7" y2="67.1"/>
        <line x1="63.2" y1="67" x2="76.8" y2="33"/>
      </g>
      <path d="M50 37 L45.5 50 L54.5 50 Z" fill="#FF9E2C"/>
    </g>
    <text x="316" y="122" text-anchor="middle">B + amber core</text>

    <!-- C in thin frame -->
    <g transform="translate(416,16) scale(2)">
      <rect width="100" height="100" rx="22" fill="#0A0B0D"/>
      <rect x="9" y="9" width="82" height="82" rx="19" fill="none" stroke="#242930" stroke-width="2.5"/>
      <g stroke="#F4F6F8" stroke-width="11" stroke-linecap="butt">
        <line x1="24.2" y1="35" x2="35.8" y2="65"/>
        <line x1="39.7" y1="65.1" x2="48.3" y2="46.9"/>
        <line x1="51.7" y1="46.9" x2="60.3" y2="65.1"/>
        <line x1="64.2" y1="65" x2="75.8" y2="35"/>
      </g>
    </g>
    <text x="516" y="122" text-anchor="middle">C in thin frame</text>

    <!-- D in ring -->
    <g transform="translate(616,16) scale(2)">
      <rect width="100" height="100" rx="22" fill="#0A0B0D"/>
      <circle cx="50" cy="50" r="38" fill="none" stroke="#242930" stroke-width="2.5"/>
      <g stroke="#F4F6F8" stroke-width="11" stroke-linecap="butt">
        <line x1="24.2" y1="35" x2="35.8" y2="65"/>
        <line x1="39.7" y1="65.1" x2="48.3" y2="46.9"/>
        <line x1="51.7" y1="46.9" x2="60.3" y2="65.1"/>
        <line x1="64.2" y1="65" x2="75.8" y2="35"/>
      </g>
    </g>
    <text x="716" y="122" text-anchor="middle">D in ring</text>

    <!-- E uneven modules -->
    <g transform="translate(16,166) scale(2)">
      <rect width="100" height="100" rx="22" fill="#0A0B0D"/>
      <g stroke="#F4F6F8" stroke-width="13" stroke-linecap="butt">
        <line x1="24.6" y1="39" x2="35.4" y2="66"/>
        <line x1="39.3" y1="67.1" x2="48.7" y2="46.9"/>
        <line x1="51.3" y1="46.9" x2="60.7" y2="67.1"/>
        <line x1="64.6" y1="66" x2="75.4" y2="39"/>
      </g>
    </g>
    <text x="116" y="272" text-anchor="middle">E uneven outer bars</text>

    <!-- F last bar amber -->
    <g transform="translate(216,166) scale(2)">
      <rect width="100" height="100" rx="22" fill="#0A0B0D"/>
      <g stroke-width="13" stroke-linecap="butt">
        <line x1="23.2" y1="33" x2="36.8" y2="67" stroke="#F4F6F8"/>
        <line x1="39.3" y1="67.1" x2="48.7" y2="46.9" stroke="#F4F6F8"/>
        <line x1="51.3" y1="46.9" x2="60.7" y2="67.1" stroke="#F4F6F8"/>
        <line x1="63.2" y1="67" x2="76.8" y2="33" stroke="#FF9E2C"/>
      </g>
    </g>
    <text x="316" y="272" text-anchor="middle">F active edge module</text>

    <!-- G fallback: nested squares (host>app) -->
    <g transform="translate(416,166) scale(2)">
      <rect width="100" height="100" rx="22" fill="#0A0B0D"/>
      <rect x="20" y="20" width="60" height="60" rx="14" fill="none" stroke="#F4F6F8" stroke-width="6"/>
      <rect x="37" y="37" width="26" height="26" rx="6" fill="#FF9E2C"/>
    </g>
    <text x="516" y="272" text-anchor="middle">G host &gt; app</text>

    <!-- H fallback: aperture A -->
    <g transform="translate(616,166) scale(2)">
      <rect width="100" height="100" rx="22" fill="#0A0B0D"/>
      <g stroke="#F4F6F8" stroke-width="13" stroke-linecap="butt">
        <line x1="26" y1="70" x2="47" y2="30"/>
        <line x1="53" y1="30" x2="74" y2="70"/>
        <line x1="26" y1="70" x2="74" y2="70"/>
      </g>
    </g>
    <text x="716" y="272" text-anchor="middle">H A monogram</text>

  </g>
</svg>