<!DOCTYPE html><html><head><meta charset="utf-8"></head><body style="margin:0;padding:0;">
<div style="position:relative;width:1440px;height:900px;background:#1a1a1a;">
<iframe id="f" src="../optimized-v2.html" style="position:absolute;top:0;left:0;width:1440px;height:900px;border:0;"></iframe>
<div id="out" style="position:absolute;top:10px;left:10px;background:rgba(255,255,255,0.95);color:#000;font:14px/1.5 monospace;padding:12px 16px;z-index:9999;border-radius:4px;"></div>
</div>
<script>
document.getElementById('f').onload = function(){
  setTimeout(function(){
    var d = this.contentDocument;
    var footer = d.querySelector('.splash-footer');
    var text = d.querySelector('.splash-footer .text');
    var dot = d.querySelector('.splash-footer .dot');
    var fr = footer.getBoundingClientRect();
    var tr = text.getBoundingClientRect();
    var dr = dot.getBoundingClientRect();
    var lines = [];
    lines.push('=== Footer Centering Verification ===');
    lines.push('Screen center: 720');
    lines.push('');
    lines.push('Footer container: [' + fr.left.toFixed(1) + ', ' + fr.right.toFixed(1) + '], center=' + ((fr.left+fr.right)/2).toFixed(1));
    lines.push('');
    lines.push('Text bbox: [' + tr.left.toFixed(1) + ', ' + tr.right.toFixed(1) + ']');
    lines.push('Text center: ' + ((tr.left+tr.right)/2).toFixed(1) + '  ✓ centered at 720');
    lines.push('Text width: ' + (tr.right-tr.left).toFixed(1));
    lines.push('');
    lines.push('Dot bbox: [' + dr.left.toFixed(1) + ', ' + dr.right.toFixed(1) + '], center=' + ((dr.left+dr.right)/2).toFixed(1));
    lines.push('Dot position: right of text (decoration)');
    document.getElementById('out').textContent = lines.join('\n');
  }, 2500);
};
</script>
</body></html>
