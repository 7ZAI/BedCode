<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>BedCode Splash — Optimized v2</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- JetBrains Mono：设计系统推荐的终端/CLI 字体；swap 避免 FOIT -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /* ==================== 品牌常量（对齐 SplashLoading.vue） ==================== */
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    /* 全局字体：正文 sans-serif，mono 由 .wb-mono 单独声明 */
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }
  .wb-mono {
    /* JetBrains Mono 优先，回退到系统 mono 栈 */
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace;
    font-size: calc(12.5px * var(--ui-scale));
    font-feature-settings: "ss01" on, "zero" on;
  }
  :root {
    --ui-scale: 1;
  }

  /* ==================== Splash 主容器 ==================== */
  .splash-root {
    --splash-bg-from: #2e2a22;
    --splash-bg-to: #0a0907;
    --splash-text: #ece8dc;
    --splash-text-dim: rgba(236, 232, 220, 0.55);
    --splash-text-faint: rgba(236, 232, 220, 0.35);
    --splash-border: rgba(236, 232, 220, 0.09);
    --splash-track: rgba(236, 232, 220, 0.12);
    --splash-success: rgba(140, 212, 138, 0.92);   /* 弱化终端绿，避免刺眼 */

    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    color: var(--splash-text);
    /* 三层背景：中央辉光 + 底部 vignette + 品牌渐变 */
    background:
      radial-gradient(ellipse 68% 46% at 50% 40%, rgba(236, 232, 220, 0.06), transparent 70%),
      radial-gradient(ellipse 100% 60% at 50% 110%, rgba(0, 0, 0, 0.6), transparent 60%),
      linear-gradient(135deg, var(--splash-bg-from), var(--splash-bg-to));
  }

  /* 呼吸辉光层：极克制（opacity 0.4 → 0.55，周期 8s），仅烘托 logo 周围 */
  .splash-halo {
    position: absolute;
    left: 50%;
    top: 40%;
    transform: translate(-50%, -50%);
    width: 520px;
    height: 520px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, rgba(236, 232, 220, 0.09), rgba(236, 232, 220, 0.02) 40%, transparent 65%);
    filter: blur(36px);
    opacity: 0.4;
    animation: splash-halo-breath 8s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes splash-halo-breath {
    0%, 100% { opacity: 0.4; transform: translate(-50%, -50%) scale(0.97); }
    50%      { opacity: 0.55; transform: translate(-50%, -50%) scale(1.03); }
  }

  /* 内容层：所有元素以屏幕中线为中心堆叠，共享同一条水平中心基线 */
  .splash-content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center; /* 关键：水平居中 */
  }

  /* 技术内容列：与 logo/brand/tagline 共享同一条水平中心基线 */
  .splash-technical {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ==================== 品牌 Logo ==================== */
  /* logo 方块内部居中对齐 SVG，外部以屏幕中线为中心 */
  .splash-logo-wrap {
    margin-bottom: 1.75rem;
  }
  .splash-logo {
    position: relative;
    display: flex;
    height: 72px;
    width: 72px;
    align-items: center;
    justify-content: center;
    border-radius: 1rem;
    background:
      linear-gradient(145deg, rgba(236, 232, 220, 0.08), transparent 55%),
      linear-gradient(135deg, var(--splash-bg-from), var(--splash-bg-to));
    border: 1px solid var(--splash-border);
    box-shadow:
      0 12px 40px rgba(0, 0, 0, 0.55),
      inset 0 1px 0 rgba(236, 232, 220, 0.06);
  }
  /* Logo 外发光 */
  .splash-logo::before {
    content: "";
    position: absolute;
    inset: -12px;
    border-radius: 1.3rem;
    background: radial-gradient(circle at 50% 50%, rgba(236, 232, 220, 0.13), transparent 70%);
    filter: blur(16px);
    z-index: -1;
    pointer-events: none;
  }
  .splash-logo svg {
    height: 2.75rem;
    width: 2.75rem;
    color: var(--splash-text);
    /* 极简辉光，符合 "Minimal glow" 建议 */
    filter: drop-shadow(0 0 6px rgba(236, 232, 220, 0.22));
  }

  /* ==================== 品牌名 + 副标语 ==================== */
  /* brand / tagline 与 logo / terminal / boot log 共用屏幕中线为中心基线 */
  .splash-brand {
    margin-bottom: 0.375rem;
    font-size: 1.3rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    color: var(--splash-text);
    line-height: 1.5;
    text-shadow: 0 0 20px rgba(236, 232, 220, 0.18);
    text-align: center;
  }
  .splash-tagline {
    margin-bottom: 1.75rem;
    font-size: 0.75rem;
    letter-spacing: 0.06em;
    color: var(--splash-text-dim);
    line-height: 1.5;
    text-align: center;
  }

  /* ==================== 终端启动行 ==================== */
  .splash-terminal {
    display: flex;
    height: 1.25rem;
    align-items: center;
    font-size: calc(13px * var(--ui-scale));
    line-height: 1;
    margin-bottom: 1.25rem;
  }
  .splash-prompt {
    color: var(--splash-text-faint);
    /* 提示符 $ 微微发光 */
    text-shadow: 0 0 6px rgba(236, 232, 220, 0.2);
  }
  .splash-typed {
    display: inline-block;
    overflow: hidden;
    white-space: nowrap;
    vertical-align: bottom;
    color: var(--splash-text);
    animation: splash-typing 0.6s steps(7, end) 0.45s both;
    text-shadow: 0 0 10px rgba(236, 232, 220, 0.22);
  }
  .splash-caret {
    display: inline-block;
    width: 0.55em;
    height: 1.05em;
    margin-left: 3px;
    background: var(--splash-text);
    /* 磷光效果：box-shadow 让光标像 CRT 磷光余晖 */
    box-shadow: 0 0 8px rgba(236, 232, 220, 0.7);
    animation: splash-caret-blink 1s steps(1) infinite;
  }

  /* ==================== Boot log 阶段栈（替代进度条） ==================== */
  .splash-bootlog {
    margin-top: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }
  /* Boot log 行：grid 三列（1fr | auto | 1fr），text 居中列严格居中于 720；
     mark 在左列右对齐（靠 text 左侧），作为左装饰不推走 text */
  .bootlog-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    font-size: calc(11px * var(--ui-scale));
    color: var(--splash-text-dim);
    line-height: 1.4;
    opacity: 0;
    transform: translateY(4px);
    animation: bootlog-appear 0.3s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  .bootlog-row .mark {
    grid-column: 1;
    justify-self: end; /* 靠右贴近 text 左侧 */
    display: inline-flex;
    align-items: center;
    font-weight: 500;
    color: var(--splash-success);
    text-shadow: 0 0 6px rgba(140, 212, 138, 0.4);
    padding-right: 0.55rem; /* mark 与 text 的呼吸 */
  }
  .bootlog-row .text {
    grid-column: 2; /* 中间 auto 列：text bbox 严格居中于屏幕中线 */
    color: var(--splash-text-dim);
    text-align: center;
  }

  /* Boot log 分四阶段，形成节奏 */
  .bootlog-row[data-delay="1"] { animation-delay: 0.65s; }
  .bootlog-row[data-delay="2"] { animation-delay: 0.95s; }
  .bootlog-row[data-delay="3"] { animation-delay: 1.25s; }
  .bootlog-row[data-delay="4"] { animation-delay: 1.55s; }

  /* 段式进度指示：4 段方块对应 boot log 完成度；整段以屏幕中线为中心 */
  .splash-progress-track {
    margin-top: 1.5rem;
    display: flex;
    gap: 4px;
    align-items: center;
    justify-content: center;
  }
  .splash-progress-track .seg {
    width: 22px;
    height: 2px;
    background: var(--splash-track);
    border-radius: 1px;
    opacity: 0;
    animation: seg-appear 0.35s ease-out both, seg-fill 0.35s ease-out both;
  }
  .splash-progress-track .seg.done {
    background: var(--splash-text);
    box-shadow: 0 0 4px rgba(236, 232, 220, 0.35);
  }
  /* 段与 boot log 同步入场 */
  .splash-progress-track .seg[data-delay="1"] { animation-delay: 0.65s, 0.65s; }
  .splash-progress-track .seg[data-delay="2"] { animation-delay: 0.95s, 0.95s; }
  .splash-progress-track .seg[data-delay="3"] { animation-delay: 1.25s, 1.25s; }
  .splash-progress-track .seg[data-delay="4"] { animation-delay: 1.55s, 1.55s; }

  @keyframes bootlog-appear {
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes seg-appear {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes seg-fill {
    from { transform: scaleX(0); transform-origin: left; }
    to   { transform: scaleX(1); transform-origin: left; }
  }

  /* footer 以屏幕中线为中心：text 居中在 720px，dot 作为右侧装饰 */
  .splash-footer {
    position: absolute;
    bottom: 1.5rem;
    left: 0;
    right: 0;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    font-size: 10px;
    color: var(--splash-text-faint);
    letter-spacing: 0.05em;
    opacity: 0;
    animation: bootlog-appear 0.4s ease-out 1.75s both;
  }
  .splash-footer .text {
    grid-column: 2;
    text-align: center;
  }
  .splash-footer .dot {
    grid-column: 3;
    justify-self: start;
    margin-left: 0.5rem;
    display: inline-block;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--splash-success);
    box-shadow: 0 0 6px rgba(140, 212, 138, 0.5);
  }

  /* ==================== 入场编排 ==================== */
  @keyframes splash-rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .splash-rise {
    animation: splash-rise 0.3s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  .splash-rise-1 { animation-delay: 0.08s; }
  .splash-rise-2 { animation-delay: 0.14s; }
  .splash-rise-3 { animation-delay: 0.22s; }

  /* ==================== 打字机 + 光标 ==================== */
  @keyframes splash-typing {
    from { width: 0; }
    to   { width: 7ch; }
  }
  @keyframes splash-caret-blink {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0; }
  }
  .splash-glyph-caret {
    animation: splash-caret-blink 1.2s steps(1) 0.9s infinite;
  }

  /* ==================== 减弱动态效果（Accessibility） ==================== */
  /* 收敛所有入场到终态，停止循环动画；光标类停闪并保持可见 */
  @media (prefers-reduced-motion: reduce) {
    .splash-rise,
    .splash-typed,
    .bootlog-row,
    .splash-progress-track .seg,
    .splash-footer {
      animation-duration: 0.01ms !important;
      animation-delay: 0ms !important;
      animation-iteration-count: 1 !important;
    }
    .splash-caret,
    .splash-glyph-caret,
    .splash-halo {
      animation: none !important;
    }
    .splash-caret,
    .splash-glyph-caret {
      opacity: 1;
    }
    .bootlog-row,
    .splash-progress-track .seg,
    .splash-footer {
      opacity: 1;
      transform: none;
    }
  }
</style>
</head>
<body>
<div class="splash-root" role="status" aria-label="BedCode is initializing">
  <!-- 呼吸辉光层（装饰，屏幕阅读器忽略） -->
  <div class="splash-halo" aria-hidden="true"></div>

  <div class="splash-content">
    <!-- Logo -->
    <div class="splash-rise splash-logo-wrap">
      <div class="splash-logo">
        <svg viewBox="0 0 100 100" fill="currentColor" aria-hidden="true">
          <path d="M 24 18 L 59 50 L 24 82 L 32 74 L 51 50 L 32 26 Z" />
          <path class="splash-glyph-caret" d="M 51 60 L 84 62 L 53 65 Z" />
        </svg>
      </div>
    </div>

    <!-- Brand + tagline -->
    <div class="splash-rise splash-rise-1 splash-brand">BedCode</div>
    <div class="splash-rise splash-rise-2 splash-tagline">LAN remote terminal workbench</div>

    <!-- 技术内容列：整组以屏幕中线为中心 -->
    <div class="splash-technical">
      <!-- Terminal boot line（主焦点：打字机 + 光标） -->
      <div class="splash-rise splash-rise-3 wb-mono splash-terminal">
        <span class="splash-prompt">$&nbsp;</span><span class="splash-typed">bedcode</span><span class="splash-caret" aria-hidden="true"></span>
      </div>

      <!-- Boot log stage stack -->
      <div class="splash-bootlog wb-mono" role="log">
        <div class="bootlog-row" data-delay="1">
          <span class="mark" aria-hidden="true">✓</span><span class="text">loading modules</span>
        </div>
        <div class="bootlog-row" data-delay="2">
          <span class="mark" aria-hidden="true">✓</span><span class="text">opening pty</span></div>
        <div class="bootlog-row" data-delay="3">
          <span class="mark" aria-hidden="true">✓</span><span class="text">binding ports</span>
        </div>
        <div class="bootlog-row" data-delay="4">
          <span class="mark" aria-hidden="true">✓</span><span class="text">sessions ready</span>
        </div>
      </div>

      <!-- 段式进度指示（辅助视觉） -->
      <div class="splash-progress-track" aria-hidden="true">
        <span class="seg done" data-delay="1"></span>
        <span class="seg done" data-delay="2"></span>
        <span class="seg done" data-delay="3"></span>
        <span class="seg done" data-delay="4"></span>
      </div>
    </div>
  </div>

  <!-- 底部系统状态微信息；dot + text 作为整体居中于屏幕中线 -->
  <div class="splash-footer wb-mono" aria-hidden="true">
    <span class="dot" aria-hidden="true"></span>
    <span class="text">bedcode v1.0.0 · LAN remote terminal</span>
  </div>
</div>
</body>
</html>
