<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>
<div style="position:relative;width:1440px;height:900px;background:#1a1a1a;">
<iframe id="f" src="optimized-v2.html" style="position:absolute;top:0;left:0;width:1440px;height:900px;border:0;"></iframe>
<pre id="out" style="position:absolute;top:10px;left:10px;background:#fff;color:#000;font:14px monospace;padding:10px;z-index:9999;"></pre>
</div>
<script>
document.getElementById('f').onload = function(){
  setTimeout(function(){
    var d = this.contentDocument;
    var text = d.querySelector('.splash-footer .text');
    var dot = d.querySelector('.splash-footer .dot');
    var tr = text.getBoundingClientRect();
    var dr = dot.getBoundingClientRect();
    var lines = [];
    lines.push('Screen center: 720');
    lines.push('Footer text bbox: [' + tr.left.toFixed(1) + ', ' + tr.right.toFixed(1) + ']');
    lines.push('Footer text center: ' + ((tr.left+tr.right)/2).toFixed(1));
    lines.push('Footer dot bbox: [' + dr.left.toFixed(1) + ', ' + dr.right.toFixed(1) + ']');
    lines.push('Footer dot center: ' + ((dr.left+dr.right)/2).toFixed(1));
    lines.push('Text width: ' + (tr.right-tr.left).toFixed(1));
    document.getElementById('out').textContent = lines.join('\n');
  }, 2500);
};
</script>
</body></html>
